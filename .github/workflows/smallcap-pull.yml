# 5.2 WEG 1b — isolierter Small-Cap-CI-Pull (Council-Entscheid Tag 432, s. protocol/
# 5.2-weg1b-universe-registered-20260722.md Chunk 4 / Einwand 3+8). Getrennter Workflow
# statt Erweiterung von daily-pull.yml: 3 von 4 Ratsstimmen (Mechaniker, Risiko-Ingenieur,
# Wartbarkeits-Praktiker) sahen Option B (Zusatz-Shards in daily-pull.yml) als Gefahr fuer
# Karls einzigen Alarm-Kanal (coverage-gate.js liest EIN n_total/Manifest — eine zweite,
# andere Watchlist in derselben Matrix wuerde diesen Nenner verfaelschen). Dieser Workflow
# ruehrt daily-pull.yml NICHT an: eigene Matrix (N=4, ~194 Ticker/Shard — weit unter dem in
# daily-pull.yml bewiesenen ~1394/Shard-Limit gegen Yahoo-Cloudflare-Drosselung), eigener
# Cron-Slot (versetzt zum Hauptlauf 02:17 UTC, NICHT parallel — sonst verdoppelt sich exakt
# die Yahoo-Last, die Tag 430 zum 87%-Fehlschlag fuehrte), eigenes Coverage-Verstaendnis
# (DIAGNOSTIC, kein hartes Gate).
#
# HANDOFF (Advocatus-Diaboli-Einwand aus dem Council, Tag 432): der urspruengliche Plan
# ("Artefakt an den scoring-Job in daily-pull.yml reichen") waere gescheitert — GitHub-
# Actions-Artefakte sind pro Workflow-RUN gescopt, ein fremder Workflow kann sie nicht
# lesen. snapshots-smallcap/ wird auch NICHT committet (gleicher Grund wie snapshots/ in
# .gitignore: taeglicher Commit von hunderten Snapshot-JSONs waere Repo-Bloat). Stattdessen:
# GH-Actions-CACHE unter einem stabilen Key (repo-weit sichtbar, nicht run-gescopt) —
# dieser Workflow schreibt (job "merge"), der scoring-Job in daily-pull.yml restored ihn
# (ein einzelner zusaetzlicher, fail-soft Cache-Restore-Schritt dort, gleiche Technik wie
# der dort bereits bestehende "Restore Coverage-Floor Baseline"-Schritt). Kein `needs:`
# zwischen den Dateien moeglich (GHA kennt das datei-uebergreifend nicht) -> fail-soft ist
# strukturell garantiert: fehlt der Cache, faellt loadSmallcapUniverse() (run-screener.js)
# auf sein bestehendes Fail-soft-Verhalten zurueck (Hauptkorpus-Fallback), nichts blockt.
#
# Seit Tag 439 gibt es EINEN Commit-Schritt (der woechentliche Reconcile schreibt
# watchlist-smallcap.json). Die Schreibrechte haengen deshalb NICHT mehr workflow-weit,
# sondern nur am merge-Job — die vier Abruf-Shards laufen weiter mit Lese-Token.
name: Small-Cap Pull (5.2, isoliert)

on:
  schedule:
    # Versetzt zu daily-pull.yml (02:17 UTC) — dessen Pull+Merge laeuft typischerweise
    # binnen 2-3h durch; 06:00 UTC laesst reichlich Abstand, damit beide Workflows nie
    # gleichzeitig Yahoo belasten (Advocatus-Diaboli-Einwand).
    - cron: '0 6 * * 2-6'
  workflow_dispatch: {}

# Karl-Entscheid 27.07.2026 (Frage 1 = A): der Reconcile darf die Small-Cap-Liste
# woechentlich selbst aufraeumen. Er committet AUSSCHLIESSLICH watchlist-smallcap.json.
#
# ⚠ KORREKTUR (unabhaengige Pruefung 27.07.): hier stand contents: write auf WORKFLOW-Ebene.
# Das gibt auch den vier Abruf-Shards einen Schreib-Token, den sie nie brauchen — die ziehen
# nur Kursdaten. Ein Token ist genau so gefaehrlich wie die Summe der Stellen, an denen er
# herumliegt. Standard bleibt Lesen; Schreiben haengt jetzt am merge-Job, der als Einziger
# committet.
permissions:
  contents: read

concurrency:
  group: smallcap-pull
  cancel-in-progress: false

env:
  SHARD_COUNT: '4'

jobs:
  # ============================================================================
  # PULL (4-Shard-Matrix). Jeder Shard restored den zuletzt gemergten Small-Cap-Store
  # aus dem Cache (Diaet-Grundlage fuer FUNDAMENTALS_MAX_AGE_DAYS in pull-yahoo.js —
  # ohne Vorzustand waere jeder Lauf ein teurer Voll-Pull), zieht seine Ticker-Scheibe
  # (--shard i/N slice intern per hash(ticker)%N, wie im Hauptlauf) und laedt seine
  # neu/aktualisierten Snapshots als Artefakt hoch (gueltig, weil "merge" derselbe
  # Workflow-RUN ist — anders als der Handoff an daily-pull.yml).
  # ============================================================================
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify watchlist-smallcap.json sanity
        run: |
          if [ ! -f watchlist-smallcap.json ]; then
            echo "::error::watchlist-smallcap.json missing"
            exit 1
          fi
          size=$(node -e "console.log((JSON.parse(require('fs').readFileSync('watchlist-smallcap.json','utf8')).stocks||[]).length)")
          echo "watchlist-smallcap size: $size"
          if [ "$size" -lt 500 ]; then
            echo "::error::watchlist-smallcap.json has only $size entries (expected ~775) — refusing to pull against a possibly corrupted list"
            exit 1
          fi

      - name: Assert shard index in range
        run: |
          if [ "${{ matrix.shard }}" -ge "$SHARD_COUNT" ] || [ "${{ matrix.shard }}" -lt 0 ]; then
            echo "::error::shard index ${{ matrix.shard }} out of range for N=$SHARD_COUNT"
            exit 1
          fi

      # Restore-only: der zuletzt gemergte Store (job "merge" unten schreibt ihn), damit
      # die Freshness-Diaet in pull-yahoo.js greift. Fehlt er (allererster Lauf) -> leerer
      # Ordner -> pull-yahoo.js macht fuer diesen Shard einen Voll-Pull (erwartet, einmalig).
      - name: Restore merged small-cap store (diet baseline)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: snapshots-smallcap
          key: snapshots-smallcap-store-nonexistent
          restore-keys: |
            snapshots-smallcap-store-

      - name: Run Yahoo Pull (small-cap shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }})
        env:
          PULL_CONCURRENCY: '8'
          MIN_MCAP_USD: '300000000'
          FUNDAMENTALS_MAX_AGE_DAYS: '7'
        run: node pull-yahoo.js --shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }} --watchlist watchlist-smallcap.json --output snapshots-smallcap --rate-limit 2000
        continue-on-error: true
        timeout-minutes: 45

      - name: Upload shard snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots-smallcap-shard-${{ matrix.shard }}
          path: |
            snapshots-smallcap/*.json
            !snapshots-smallcap/_manifest.json
          if-no-files-found: warn
          retention-days: 1

  # ============================================================================
  # MERGE (once). Setzt auf dem zuletzt gemergten Store auf (Cache-Restore), ueberlagert
  # mit den frisch hochgeladenen Shard-Snapshots (merge-multiple, disjunkte Ticker-
  # Scheiben -> keine echte Kollision) und speichert das Ergebnis unter einem NEUEN,
  # run-eindeutigen Key zurueck (restore-keys-Praefix im naechsten Lauf/im scoring-Job
  # von daily-pull.yml findet dann automatisch diesen neuesten Stand — selbes Muster
  # wie die per-Shard-Caches in daily-pull.yml).
  # ============================================================================
  merge:
    needs: pull
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nur DIESER Job committet (die aufgeraeumte Small-Cap-Liste) — nur er braucht Schreibrecht.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore merged small-cap store (baseline for tickers no shard touched this run)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: snapshots-smallcap
          key: snapshots-smallcap-store-nonexistent
          restore-keys: |
            snapshots-smallcap-store-

      - name: Download all shard snapshots (overlays fresh pulls onto the restored baseline)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: snapshots-smallcap-shard-*
          path: snapshots-smallcap
          merge-multiple: true

      # DIAGNOSTIC, non-blocking: reines Log, kein zweiter Alarm-Kanal neben Karls einzigem
      # sanktionierten (coverage-status.json/Dashboard-Banner fuer den Hauptkorpus).
      - name: Small-Cap Freshness (informational only)
        continue-on-error: true
        run: node scripts/verify-freshness.js ./snapshots-smallcap "Small-Cap"

      # 5.2-Auflagen 4+5 (protocol/5.2-weg1b-universe-registered-20260722.md):
      # Band-/Operating-Reconcile. BEWUSST --dry-run: dieser Workflow hat
      # `permissions: contents: read` und committet nichts (Council-Entscheid Tag 432).
      # Der Schritt MISST und berichtet also nur — inkl. der Auflage-6-Ueberschneidung
      # mit dem Hauptuniversum. Ob der Reconcile automatisch schreiben darf, haengt an
      # der Eigentumsgrenze (Auflage 6) und ist ein offener Karl-Entscheid.
      # Karl-Entscheid 27.07. (Frage 1 = A): woechentlich automatisch aufraeumen.
      # NUR SAMSTAGS scharf — der Reconcile entfernt Mitgliedschaften; das soll einmal die
      # Woche passieren und nicht taeglich, damit ein einzelner schlechter Datentag nicht
      # durchschlaegt. An den anderen Tagen laeuft er als reiner Bericht mit.
      #
      # --max-remove-pct 40 statt der Standard-25: gemessen am echten Datenstand wuerden beim
      # ⚠ Herkunft dieser Zahl, damit sie niemand falsch nachprueft: sie stammt aus dem
      # SNAPSHOT-BESTAND EINES CI-LAUFS (12.321 Dateien), nicht vom Entwicklungsrechner. Lokal
      # liegen nur rund 100 der 775 Small-Cap-Snapshots vor, dort meldet derselbe Befehl
      # entsprechend nur 9 Entfernungen — kein Widerspruch, sondern eine andere Datenbasis.
      # Fuer die Sperre ist beides unkritisch: bei 9 wie bei 184 loest sie nicht aus.
      # ERSTEN scharfen Lauf 184 von 775 Namen (23,7 %) entfernt — fast alles Fonds-Huellen,
      # die seit dem Aufbau der Liste drinstehen. Das liegt so knapp unter 25 %, dass die
      # Sperre grundlos ausloesen wuerde. Danach fallen die Zahlen auf einzelne Namen/Woche.
      - name: Small-Cap Reconciliation (Auflagen 4+5)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "6" ]; then
            echo "Samstag — Reconcile schreibt."
            node scripts/reconcile-smallcap.js --max-remove-pct 40 --report smallcap-reconcile.json
          else
            echo "Kein Samstag — Reconcile laeuft als reiner Bericht."
            node scripts/reconcile-smallcap.js --dry-run --report smallcap-reconcile.json
          fi

      # Committet AUSSCHLIESSLICH die Mitgliedschaftsliste. Keine Vintages, keine Snapshots,
      # keine Ausgaben — die bleiben wie bisher aus diesem Workflow heraus.
      # ⚠ continue-on-error BEWUSST ENTFERNT (unabhaengige Pruefung 27.07., Schwere hoch).
      # Vorher konnte dieser Schritt NIE rot werden: die Retry-Schleife brach bei jedem
      # Misserfolg still ab, und continue-on-error verschluckte auch einen echten Fehler.
      # Folge waere gewesen: der Aufraeumer entfernt Namen, der Push scheitert, der Lauf bleibt
      # gruen — und Karl haelt die Liste fuer aufgeraeumt, obwohl nichts angekommen ist. Ein
      # stiller Verlust in einer Mitgliedschaftsliste ist genau die Sorte Fehler, die dieses
      # Repo nirgends haben darf. Jetzt: drei Versuche, danach rotes X.
      - name: Commit aufgeraeumte Small-Cap-Liste
        if: always()
        run: |
          git config user.name "yahoo-pull-bot"
          git config user.email "yahoo-pull-bot@users.noreply.github.com"
          git add watchlist-smallcap.json
          if git diff --staged --quiet; then
            echo "Keine Aenderung an der Small-Cap-Liste."
          else
            # Die Zahlen gehoeren IN die Commit-Zeile, nicht nur in ein Artefakt: Karl liest
            # git log, keine Artefakt-Anhaenge. Ein Lauf, der wortlos ein Viertel der Liste
            # entfernt, ist keine gute Nachricht, auch wenn er richtig liegt.
            #
            # ZWEI FALLEN, beide am echten Bericht gemessen (27.07.), nicht angenommen:
            #   (a) `entfernt` ist ein ARRAY von {ticker,grund,mcap}, kein Zaehler — direkt
            #       eingesetzt haette dort "[object Object],[object Object],…" gestanden.
            #   (b) `gruende` zaehlt ALLE Entscheidungen, auch die Behalte-Gruende. Der
            #       groesste Posten ist "kein-snapshot" (lokal 674) — der haette in der
            #       Commit-Zeile wie 674 Loeschungen ausgesehen. Gezaehlt wird deshalb ueber
            #       das `entfernt`-Array, nicht ueber `gruende`.
            zeile=$(node -e "
              try {
                const r = require('./smallcap-reconcile.json');
                const weg = Array.isArray(r.entfernt) ? r.entfernt : [];
                const z = {};
                for (const e of weg) z[e.grund] = (z[e.grund] || 0) + 1;
                const g = Object.entries(z).sort((a,b) => b[1]-a[1]).map(([k,v]) => k + '=' + v).join(', ');
                console.log(r.vorher + ' -> ' + r.nachher + ', ' + weg.length + ' entfernt' + (g ? ' (' + g + ')' : ''));
              } catch (e) { console.log('Bericht nicht lesbar'); }
            ")
            git commit -m "chore: small-cap reconcile $(date -u +%F) — $zeile"
            # erfolg bleibt 0, bis ein Push wirklich durch ist. Jeder Ausstieg ohne erfolg=1
            # endet unten in einem roten X — kein stiller Abbruch mehr.
            erfolg=0
            for i in 1 2 3; do
              git fetch origin main || { echo "fetch fehlgeschlagen (Versuch $i)"; sleep $((5 * i)); continue; }
              if ! git rebase --autostash origin/main; then
                git rebase --abort || true
                echo "rebase fehlgeschlagen (Versuch $i) — vermutlich Konflikt an watchlist-smallcap.json"
                sleep $((5 * i)); continue
              fi
              if git push origin HEAD:main; then erfolg=1; echo "Small-Cap-Liste committet"; break; fi
              echo "push fehlgeschlagen (Versuch $i)"
              sleep $((5 * i))
            done
            if [ "$erfolg" != "1" ]; then
              echo "::error::Small-Cap-Reconcile: die aufgeraeumte Liste konnte nach 3 Versuchen NICHT gepusht werden. Die Entfernungen sind NICHT wirksam — der naechste Lauf wiederholt sie. Bitte nachsehen, warum der Push scheitert."
              exit 1
            fi
          fi

      - name: Upload reconciliation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smallcap-reconcile
          path: smallcap-reconcile.json
          if-no-files-found: warn
          retention-days: 30

      - name: Save merged small-cap store
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: snapshots-smallcap
          key: snapshots-smallcap-store-${{ github.run_id }}
