# ============================================================================
# Tag 576 / Schritt 0 — WEGWERF-PROBE fuer den Custom-Exchange-Kanal.
# ============================================================================
# WARUM DIESE DATEI EXISTIERT (und warum sie NICHT in den Tagesbetrieb gehoert):
# Der Befund _BEFUND-EXCHANGE-KANAL-2026-08-04.md hat den rohen Yahoo-POST-
# Screener von KARLS HEIM-IP aus live gemessen (200er, 250 Zeilen/Seite, 29
# Boersen). Das ist NICHT dasselbe wie vom GitHub-Runner: am 03.08. haben genau
# dort otcmarkets.com und api.nasdaq.com in Timeouts/Sperren gelaufen, waehrend
# sie lokal erreichbar waren. Runner-IPs werden von Finanz-Endpunkten haerter
# behandelt. Deshalb steht im Befund §6 als KILL-KRITERIUM: liefert der rohe
# POST vom Runner 429/403/Timeout, faellt Weg (a) und der Umbau findet nicht
# statt.
#
# Diese Datei ist die Probe dazu — ausdruecklich EINMALIG und WEGWERF:
#   - nur `workflow_dispatch` (kein Cron, kein push, kein pull_request)
#   - `permissions: contents: read` (schreibt nichts, committet nichts)
#   - beruehrt keinen Datenstand, keinen Artefakt-Vertrag, keinen Deploy
# Sie bleibt nach dem Lauf als BELEG stehen; ihre Loeschung ist ein eigener
# Karl-Punkt (Loeschen nie ohne Freigabe).
#
# WAS GEMESSEN WIRD — zwei Wege, weil zwei Fragen offen sind:
#   STUFE A (roh): Cookie von fc.yahoo.com -> Crumb von /v1/test/getcrumb ->
#     POST /v1/finance/screener. Das ist die Fallback-Bauform (~40 Zeilen) und
#     beantwortet das Kill-Kriterium woertlich so, wie es formuliert ist.
#   STUFE B (Bibliothek): derselbe POST ueber yf._fetch(url, params, moduleOpts,
#     func, needsCrumb=true) — Cookie/Crumb/Drossel erledigt yahoo-finance2
#     gratis. Das ist die geplante Bauform (~10 Zeilen). Ein gruener Stufe-A-Lauf
#     nuetzt nichts, wenn der Weg, der tatsaechlich gebaut wird, anders geblockt
#     wird — also wird er mitgemessen statt angenommen.
#
# WAS SONST NOCH AUS DIESEM EINEN LAUF FAELLT (damit kein zweiter noetig ist):
#   - die vier fraglichen Boersencodes: TYO vs JPX, NIM vs NCM, SWX vs EBS und
#     SGX vs SES/SIN (fuer SGX nennt der Befund keinen richtigen Code)
#   - Symbol-Dumps fuer FRA/MIL/SAO/MEX (3 Seiten je Boerse) als Messgrundlage
#     fuer den Zweitlistungs-Anteil (Kipp-Kriterium >70 %)
#   - die Feldliste einer Screener-Zeile (welche Herkunfts-/Typ-Felder Yahoo
#     ueberhaupt mitliefert) — geraten wird hier nichts
#
# KEINE Massen-Abrufe: ~28 POSTs gesamt, eine Stichprobe. Der Lauf selbst ist
# damit zugleich der Drossel-Test (28 Anfragen hintereinander vom selben Runner).
#
# ── ERSTLAUF 30868439516 (04.08., NICHT verwertbar — Eigenfehler der Probe) ──
# Der erste Anlauf meldete Stufe A: HTTP 429 auf /v1/test/getcrumb, und Stufe B
# 20x "No set-cookie header present in Yahoo's response". Das SAH aus wie das
# Kill-Kriterium, war aber ein Fehler dieser Datei — beide Stufen sind an der
# CRUMB-BESCHAFFUNG gescheitert, nicht am Screener:
#   Stufe B: yahooFinanceFetch baut `fetchOptionsBase` (inkl. moduleOpts.
#     fetchOptions) VOR dem Crumb-Vorlauf und reicht es an getCrumb durch. Mein
#     { method:"POST", body:<JSON> } ging damit an die HTML-Seite
#     https://finance.yahoo.com/quote/AAPL — die antwortet darauf ohne
#     set-cookie, und getCrumb wirft, bevor der Screener ueberhaupt drankommt.
#   Stufe A: der Cookie-Vorlauf ueber fc.yahoo.com ist der ALTE Trick. Die
#     Bibliothek holt ihr Cookie seit Jahren von finance.yahoo.com/quote/AAPL
#     mit `accept: text/html` und `redirect: manual`. Ohne das richtige Cookie
#     antwortet /v1/test/getcrumb mit 429 — das ist eine Cookie-Absage, keine
#     Drosselung.
# Gegenbeleg, dass der Runner NICHT gesperrt ist: quote() und quoteSummary()
# tragen in yahoo-finance2 selbst needsCrumb:true und laufen im pull-Job jeden
# Tag ueber genau dieselben Runner-IPs durch (Lauf 30787450668: alle 17 Shards
# gruen). Waere die Runner-IP bei Yahoo gesperrt, gaebe es seit Monaten keine
# Kursdaten mehr.
# KORREKTUR in diesem Stand: (1) Crumb wird mit einem NORMALEN Bibliotheks-
# Aufruf vorgewaermt (yf.quote), danach liefert getCrumb den zwischengespeicherten
# Crumb zurueck, ohne noch einmal zu fetchen — der Leck-Pfad ist damit gar nicht
# mehr erreichbar. (2) Stufe A geht denselben Cookie-Weg wie die Bibliothek.
# Der Erstlauf bleibt als Beleg stehen; er ist die Ausbau-Probe fuer die
# Crumb-Vorwaermung (ohne sie: 20/20 Aufrufe tot).
# ============================================================================
name: T576 Exchange-Kanal Probe (Wegwerf)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Der Probe-Code steht bewusst INLINE (node -e) statt als Datei unter
      # scripts/: die Auflage lautet "NUR diese eine Datei darf vorab gepusht
      # werden". Deshalb auch durchgaengig doppelte Anfuehrungszeichen im JS —
      # der ganze Block ist ein einfach-gequoteter Shell-String.
      - name: POST-Stichprobe (Stufe A roh + Stufe B via yahoo-finance2 _fetch)
        run: |
          node -e '
          "use strict";
          const YF = require("yahoo-finance2").default;
          const fs = require("fs");
          const UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36";
          const MIN = 800e6, MAX = 500e9;
          const yf = new YF({ suppressNotices: ["yahooSurvey"], validation: { logErrors: false, logOptionsErrors: false } });

          function rumpf(code, offset, size, min, max) {
            return {
              size: size || 250, offset: offset || 0,
              sortField: "intradaymarketcap", sortType: "DESC", quoteType: "EQUITY",
              query: { operator: "AND", operands: [
                { operator: "btwn", operands: ["intradaymarketcap", min == null ? MIN : min, max == null ? MAX : max] },
                { operator: "eq", operands: ["exchange", code] }
              ] },
              userId: "", userIdType: "guid"
            };
          }

          async function stufeA(code) {
            const t0 = Date.now();
            try {
              // Cookie-Weg WIE DIE BIBLIOTHEK (getCrumb.js): HTML-Seite mit accept:text/html
              // und redirect:manual. fc.yahoo.com ist der alte Trick und liefert ein Cookie,
              // mit dem /v1/test/getcrumb mit 429 antwortet (Erstlauf-Beleg im Kopf).
              const r0 = await fetch("https://finance.yahoo.com/quote/AAPL", {
                headers: { "user-agent": UA, accept: "text/html,application/xhtml+xml,application/xml" },
                redirect: "manual" });
              const sc = typeof r0.headers.getSetCookie === "function" ? r0.headers.getSetCookie() : [];
              const cookie = sc.map(function (c) { return c.split(";")[0]; }).join("; ");
              const r1 = await fetch("https://query2.finance.yahoo.com/v1/test/getcrumb", { headers: { cookie: cookie, "user-agent": UA } });
              const crumb = (await r1.text()).trim();
              const url = "https://query2.finance.yahoo.com/v1/finance/screener?crumb=" + encodeURIComponent(crumb) + "&lang=en-US&region=US&formatted=false";
              const r2 = await fetch(url, { method: "POST", headers: { cookie: cookie, "content-type": "application/json", "user-agent": UA }, body: JSON.stringify(rumpf(code, 0, 25)) });
              const txt = await r2.text();
              let j = null; try { j = JSON.parse(txt); } catch (e) { j = null; }
              const r = j && j.finance && j.finance.result && j.finance.result[0];
              return { statusCookie: r0.status, cookies: sc.length, statusCrumb: r1.status, crumbLaenge: crumb.length,
                status: r2.status, ms: Date.now() - t0, total: r ? r.total : null,
                n: r && r.quotes ? r.quotes.length : 0, kopf: txt.slice(0, 240) };
            } catch (e) { return { fehler: String((e && e.message) || e), ms: Date.now() - t0 }; }
          }

          async function stufeB(code, offset, size) { return stufeBLokal(code, offset, size, null, null); }
          async function stufeBLokal(code, offset, size, min, max) {
            const t0 = Date.now();
            try {
              const antwort = await yf._fetch(
                "https://${YF_QUERY_HOST}/v1/finance/screener",
                { lang: "en-US", region: "US", formatted: "false" },
                { fetchOptions: { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(rumpf(code, offset, size, min, max)) } },
                "json", true);
              const r = antwort && antwort.finance && antwort.finance.result && antwort.finance.result[0];
              return { ok: true, ms: Date.now() - t0, total: r ? r.total : null,
                n: r && r.quotes ? r.quotes.length : 0, quotes: (r && r.quotes) || [] };
            } catch (e) {
              return { ok: false, ms: Date.now() - t0, fehler: String((e && e.message) || e),
                httpCode: e && e.code, klasse: e && e.name, quotes: [] };
            }
          }

          // Dump-Spalten fuer die Zweitlistungs-Messung. `region` steht bewusst NICHT drin:
          // sie echot die ANFRAGE-Region (fuer jede Boerse "US") und traegt keine Herkunft.
          // Getragen wird die Messung von financialCurrency (Berichtswaehrung der Firma) vs
          // currency (Notierungswaehrung) und von `market` (dr_market bei Hinterlegungsscheinen).
          function zeile(q) { return [q.symbol, q.marketCap, q.currency, q.financialCurrency || "", q.exchange, q.market || "", q.quoteType || "", q.longName || q.shortName || ""]; }

          (async function () {
            const aus = { zeit: new Date().toISOString(), node: process.version, vorwaermen: null, stufeA: null, stufeB: {}, dump: {} };

            // CRUMB VORWAERMEN — der tragende Handgriff, siehe Kopf. Ein normaler
            // Bibliotheks-Aufruf (needsCrumb:true) fuellt Cookie-Jar und Crumb-Cache;
            // jeder spaetere _fetch bekommt den Crumb zurueck, OHNE dass getCrumb noch
            // einmal fetcht — und damit ohne dass die POST-fetchOptions dorthin lecken.
            try {
              const q = await yf.quote("AAPL");
              aus.vorwaermen = { ok: true, symbol: q && q.symbol, preis: q && q.regularMarketPrice };
            } catch (e) {
              aus.vorwaermen = { ok: false, fehler: String((e && e.message) || e) };
            }
            console.log("VORWAERMEN (yf.quote AAPL, needsCrumb:true): " + JSON.stringify(aus.vorwaermen));

            aus.stufeA = await stufeA("NMS");
            console.log("STUFE-A roh NMS: " + JSON.stringify(aus.stufeA));

            const CODES = ["NMS", "NYQ", "TYO", "JPX", "NIM", "NCM", "SWX", "EBS", "SGX", "SES", "SIN",
                           "BSE", "NSI", "SHZ", "KOE", "TAI", "FRA", "MIL", "SAO", "MEX"];
            for (const c of CODES) {
              const r = await stufeB(c, 0, 250);
              aus.stufeB[c] = { ok: r.ok, ms: r.ms, total: r.total, n: r.n, fehler: r.fehler, httpCode: r.httpCode, klasse: r.klasse };
              if (r.quotes.length) {
                aus.stufeB[c].felder = Object.keys(r.quotes[0]).sort();
                aus.stufeB[c].beispiel = r.quotes[0];
                aus.dump[c] = r.quotes.map(zeile);
              }
              console.log("STUFE-B " + c + ": ok=" + r.ok + " total=" + r.total + " n=" + r.n + " " + r.ms + "ms" + (r.fehler ? " FEHLER[" + r.klasse + "/" + r.httpCode + "]=" + r.fehler : ""));
            }

            // Mehr Seiten fuer die vier Zweitlistungs-Verdaechtigen UND fuer die
            // Primaer-Boersen, die im Kipp-Fall der Ersatz waeren — sonst waere die
            // Vergleichszahl aus einer Seite geschaetzt und die aus dreien gemessen.
            for (const c of ["FRA", "MIL", "SAO", "MEX", "JPX", "SHZ", "BSE", "NSI", "KOE", "TAI"]) {
              for (const off of [250, 500]) {
                const r = await stufeB(c, off, 250);
                if (r.quotes.length) aus.dump[c] = (aus.dump[c] || []).concat(r.quotes.map(zeile));
                console.log("STUFE-B " + c + " offset=" + off + ": ok=" + r.ok + " n=" + r.n + (r.fehler ? " FEHLER=" + r.fehler : ""));
              }
            }

            // ── STUFE C: Erstlauf-Zahlen mit den RICHTIGEN Schranken ────────────────
            // Befund aus Stufe B: Yahoos serverseitiger `intradaymarketcap`-Filter rechnet in
            // der LISTING-WAEHRUNG, nicht in USD. Beleg: JPX lieferte mit 800e6..500e9 als
            // Literal einen USD-Bereich von genau 487M..3.2B — 500e9 JPY sind $3,2 Mrd, der
            // Deckel traf also punktgenau. Dasselbe bei KOE (500e9 KRW = $362M, deshalb lag
            // die GESAMTE koreanische Ausbeute unter dem $800M-Boden), BSE/NSI (INR),
            // TAI (TWD), SHZ (CNY). Dieselbe Falle hat discovery/tv-scanner.js schon geloest
            // ("sonst waere right:2e9 nur 2 Mrd LOKAL"). Stufe C wiederholt die Messung mit
            // je Boerse umgerechneten Schranken und paginiert VOLL durch — das sind die
            // Erstlauf-Untergrenzen fuer die Abnahme-Messung.
            const RATES = JSON.parse(fs.readFileSync("fx-rates.json", "utf8")).rates;
            const PRIMAER = { JPX: "JPY", SHZ: "CNY", BSE: "INR", NSI: "INR", KOE: "KRW", TAI: "TWD" };
            aus.stufeC = {};
            aus.dumpC = {};
            for (const c of Object.keys(PRIMAER)) {
              const kurs = RATES[PRIMAER[c]];
              const lokalMin = Math.floor(MIN / kurs), lokalMax = Math.ceil(MAX / kurs);
              let offset = 0, seiten = 0, gesamt = null, zeilen = [];
              while (seiten < 40) {
                const r = await stufeBLokal(c, offset, 250, lokalMin, lokalMax);
                if (!r.ok) { zeilen = null; aus.stufeC[c] = { fehler: r.fehler }; break; }
                if (gesamt === null) gesamt = r.total;
                if (!r.quotes.length) break;
                zeilen = zeilen.concat(r.quotes.map(zeile));
                seiten++;
                if (r.quotes.length < 250) break;
                offset += 250;
              }
              if (zeilen) {
                aus.stufeC[c] = { waehrung: PRIMAER[c], kurs: kurs, lokalMin: lokalMin, lokalMax: lokalMax, total: gesamt, seiten: seiten, zeilen: zeilen.length };
                aus.dumpC[c] = zeilen;
              }
              console.log("STUFE-C " + c + " (" + PRIMAER[c] + " " + lokalMin + ".." + lokalMax + "): " + JSON.stringify(aus.stufeC[c]));
            }

            fs.writeFileSync("t576-probe.json", JSON.stringify(aus, null, 1));
            const gescheitert = Object.keys(aus.stufeB).filter(function (k) { return !aus.stufeB[k].ok; });
            console.log("");
            console.log("ZUSAMMENFASSUNG: StufeA-HTTP=" + aus.stufeA.status + " · StufeB gescheitert: " + (gescheitert.join(",") || "keine"));
          })().catch(function (e) { console.error("PROBE-ABBRUCH: " + (e && e.stack)); process.exit(1); });
          '

      - name: Probe-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t576-probe
          path: t576-probe.json
          retention-days: 7
