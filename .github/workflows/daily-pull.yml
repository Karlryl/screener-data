# audit BH-136: actions/* hier auf volle Commit-SHAs gepinnt (statt des beweglichen
# @v4-Major-Tags), Version im Kommentar. Schreibberechtigter Cron-Workflow
# (permissions: contents: write) — ein kompromittierter/verschobener Tag liefe sonst
# automatisch mit Schreibrechten mit. Scope dieses Fixes: NUR diese Datei (Batch-
# Grenze); monthly-plan-check.yml/weekly-guard.yml/heartbeat.yml/monthly-sec-xbrl.yml/
# tv-reachability.yml pinnen noch auf @v4 und ein Dependabot-Update-Pfad
# (.github/dependabot.yml) fehlt — beides ausserhalb dieses Batches.
name: Daily Yahoo Pull

on:
  schedule:
    - cron: '17 2 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write

# Tag 153: serialize pushes to main — daily + monthly-sec-xbrl both push via retry-rebase.
# On the 1st of the month both fire within ~90 min of each other; without this one silently fails.
# Tag 219a (audit F-218c-03): manual workflow_dispatch runs get a per-run group so
# operators can re-run while a scheduled pull is in flight (otherwise the manual
# dispatch sits queued for up to 180 min waiting for the cron run, and on the
# free-plan can be evicted entirely). Scheduled cron runs still serialize on
# 'main-push' so daily + monthly-sec-xbrl don't clobber each other; the
# retry-with-rebase push loop handles the race the dispatch path can introduce.
# Only the merge job pushes to main — the matrix shards never touch it.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || 'main-push' }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # PREP (once) — fixes the shared state ALL shards need, then fans out.
  # ONE watchlist.json (all shards slice it internally via --shard), ONE fresh
  # fx-rates.json (USD-mcap normalisation), ONE earnings-calendar.json (drives
  # the needsFullPull diet), plus insider/canary. Emits the shard count + matrix
  # list from a SINGLE source (fromJSON) so matrix and --shard/N can never drift
  # (RED-TEAM-2 T1-b: a drifted count makes an out-of-range --shard fall back to
  # a full-universe pull — silent, expensive, cache-poisoning). No Yahoo full pull
  # here -> runs in ~5 min. Gates (watchlist sanity, fx freshness, scoring tests)
  # block the fan-out before any runner-minutes are spent on the matrix.
  # ============================================================================
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_date: ${{ steps.freeze.outputs.run_date }}
      shard_count: ${{ steps.shards.outputs.count }}
      shard_matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      # Tag 219 (audit F-219b-01 HIGH): freeze a shared run-date at job start so
      # every downstream script (in prep, pull AND merge) agrees on TODAY's date
      # even if the pull crosses UTC midnight. Passed to pull+merge as a job
      # output (env-scoped RUN_DATE_UTC there), NOT via $GITHUB_ENV which is
      # job-local. Honored by archive-old-snapshots.js and pull-historical-prices.js.
      - name: Freeze Run Date
        id: freeze
        run: |
          RUN_DATE_UTC=$(date -u +%Y-%m-%d)
          echo "run_date=$RUN_DATE_UTC" >> "$GITHUB_OUTPUT"
          echo "Frozen run date: $RUN_DATE_UTC"

      # 0.2/0.9 Sharding: N and the matrix list come from ONE place. N=17 ≈
      # 23700/1384 (cold-start full coverage of the ~23.7k universe in ~1 run) and
      # < 20 (GitHub free/public concurrent-job limit), leaving headroom for the
      # prep job (ends before the matrix) and merge/scoring (run after). Bump N
      # here ONLY — the matrix list is derived, so it cannot desync from the count.
      - name: Compute shard fan-out (single source of truth for N)
        id: shards
        env:
          SHARD_COUNT: '17'
        run: |
          echo "count=$SHARD_COUNT" >> "$GITHUB_OUTPUT"
          matrix=$(node -e "console.log(JSON.stringify([...Array(+process.env.SHARD_COUNT).keys()]))")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Shard fan-out: N=$SHARD_COUNT matrix=$matrix"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # F-CI-004: full history required for git-log operations and reliable rebase
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          # F-CI-011: cache npm dependencies to save ~30-90s per run
          cache: 'npm'

      - name: Verify Node version
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Task 0.3 (Loop B): PRE-pull test-gate. Jede Testdatei ist ein selbstlaufendes
      # node-Skript, das mit process.exit(fail ? 1 : 0) endet. Der Glob laesst
      # fixtures/-Unterordner aus. Eine kaputte Engine muss den Lauf VOR dem teuren
      # Fan-out blocken (::error:: + exit 1). Signalweg ist ausschliesslich das rote X.
      #
      # R-Gate 2.R (17.07.): Das Gate globbte NUR tests/scoring/*.test.js — die 13
      # Dateien unter tests/ liefen im CI NIE. Darunter rank-ic.test.js und
      # board-history.test.js, also ausgerechnet die Regressionstests der drei
      # T1-Funde vom 17.07. (Preis-Store-Pfad, unfertige Fenster, Ausschluss-Vertrag):
      # Sie haetten eine Wiederholung nicht verhindert, weil sie niemand gefahren haette.
      # Beide Baeume laufen jetzt im selben Gate; tests/ ist hermetisch (Temp-Fixtures)
      # und braucht kein Universum, ist also pre-pull voll aussagekraeftig.
      #
      # R-Gate 2.R Runde 3 (17.07.): Der Fix oben zaehlte Verzeichnisse NAMENTLICH auf
      # und liess damit die 5 hermetischen Tests unter lib/ weiter in KEINEM Job laufen —
      # darunter forward-returns.test.js, die Vertragspruefung von classify(), auf der der
      # ganze §8-Austrittspfad der rankIC-Messung steht. Symptom-Fix waere: lib/ dazu.
      # Wurzel ist die Aufzaehlung selbst — jeder NEUE Testordner faellt wieder still raus.
      # Darum laeuft jetzt VOR dem Gate ein Waechter, der jede getrackte *.test.js gegen
      # den Glob haelt und laut wird, wenn eine weder gegatet noch begruendet ausgenommen ist.
      - name: Test-Gate (pre-pull, Waechter + tests/ + tests/scoring/ + lib/)
        env:
          # EINE Quelle fuer Waechter UND Gate — sie koennen nicht auseinanderdriften.
          # audit BH-035: '*.test.js' -> '*test.js' erweitert — faengt auch die
          # '-test.js'-Schreibweise (tests/13f-test.js, sec-form4-test.js,
          # sec-user-agent-test.js liefen sonst in KEINEM CI-Gate; weder Waechter noch
          # Gate sahen sie ueberhaupt, weil `git ls-files '*.test.js'` sie nicht listet).
          # Alle drei sind offline/hermetisch (kein Netz) -> gehoeren ins Gate, nicht in
          # GATE_EXEMPT.
          GATE_GLOB: 'tests/*test.js tests/scoring/*test.js lib/*test.js'
          # Begruendete Ausnahmen (Praefix-Match). Jede Zeile hier braucht einen Grund:
          # tests/discovery/ (13 Dateien) = Live-Netz-Tests gegen echte Boersen-/Regulator-
          # Endpunkte (LSE, Xetra, EDINET, FinMind, …). Im pre-pull-Gate wuerde jeder
          # fremde Outage Karls Tagslauf falsch-rot blocken, bevor ein Byte Yahoo-Daten
          # gezogen ist. Sie bleiben Ad-hoc-Checks fuer die Adapter-Pflege.
          GATE_EXEMPT: 'tests/discovery/'
        run: |
          # ── Waechter: keine Testdatei darf still ungegatet bleiben ──────────────
          # Repo-Bestand = git ls-files (nicht `find`): das schliesst node_modules,
          # lokale Worktrees und ungetrackten Scratch von sich aus aus — und eine
          # nicht-eingecheckte Datei kann im CI ohnehin nie laufen.
          # Jede Schleife hier endet bewusst auf `if … fi` (Status 0) und nicht auf
          # `[ … ] && echo`: GitHub faehrt `bash -e`, und ein `x=$(…)`, dessen letzter
          # Schleifendurchlauf 1 zurueckgibt, wuerde den Schritt WORTLOS abbrechen —
          # ein falsch-rotes Gate, das Karls Tagslauf blockt, ohne zu sagen warum.
          gated=$(for t in $GATE_GLOB; do if [ -e "$t" ]; then printf '%s ' "$t"; fi; done)
          all=$(git ls-files '*test.js' | grep -v '/fixtures/' || true)
          if [ -z "$all" ]; then
            echo "::error::Waechter fand KEINE Testdatei im Repo — git ls-files kaputt oder Checkout unvollstaendig."
            exit 1
          fi
          # KEIN Heredoc: dessen Body/Delimiter muessten in Spalte 0 stehen und wuerden
          # den YAML-Block-Skalar hier beenden (= Workflow parst nicht mehr).
          ungated=$(printf '%s\n' "$all" | while IFS= read -r f; do
            case " $gated" in *" $f "*) continue ;; esac
            exempt=0
            for ex in $GATE_EXEMPT; do
              case "$f" in "$ex"*) exempt=1 ;; esac
            done
            if [ "$exempt" -eq 0 ]; then echo "$f"; fi
          done)
          if [ -n "$ungated" ]; then
            printf '%s\n' "$ungated" | while IFS= read -r f; do
              echo "::error::Testdatei $f laeuft in KEINEM Job — weder vom Gate-Glob ('$GATE_GLOB') erfasst noch begruendet ausgenommen. Glob erweitern ODER mit Begruendung in GATE_EXEMPT eintragen."
            done
            echo "::error::Ungegatete Testdatei(en) gefunden — ein neuer Testordner darf nie stumm bleiben. Aborting."
            exit 1
          fi
          echo "Waechter OK: jede Testdatei ist gegatet oder begruendet ausgenommen."

          # ── Gate ───────────────────────────────────────────────────────────────
          fail=0
          for t in $GATE_GLOB; do
            [ -e "$t" ] || continue
            echo "--- $t ---"
            if node "$t"; then
              echo "PASS $t"
            else
              echo "::error::Test failed: $t — blocking run before Yahoo pull"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more tests failed — engine/measurement is broken, aborting run."
            exit 1
          fi
          echo "All tests passed."

      # Coverage-Marker-Vertrag (coverage-status/v1) pre-pull pinnen. Der Marker
      # outputs/coverage-status.json ist Karls EINZIGER sanktionierter Alarm-Kanal
      # (Dashboard-Degradiert-Banner; kein Mail/Discord) — ein stiller Schema-Bruch
      # schaltet den Banner lautlos ab. Rein/synthetisch (<1s).
      - name: Coverage-Marker Contract Selftest
        run: node scripts/coverage-gate.js --selftest

      # NEU (Tag 280): Merge-Helfer-Selftest pre-pull. Der Umzaehler schreibt das
      # Voll-Universum-Manifest, an dem Karls Coverage-Gate haengt — ein stiller
      # Regress hier wuerde die ganze Sharding-Coverage-Messung blind machen.
      # Rein/synthetisch (assert-basiert, kein Netz, <1s).
      - name: Merge-Helper Selftest
        run: node scripts/merge-shard-manifests.js --selftest

      # Tag 132/133/165/227a: Auto-Universe-Refresh -> DIE EINE watchlist.json, die
      # alle Shards laden (jeder sliced sie intern via --shard). MUSS einmal laufen —
      # 17x parallel waere ein Race auf dieselbe Datei. MAX_UNIVERSE 25000 (Tag 227a
      # silent-cap audit). Finnhub-Secret-Warnung (Tag 232c-18) surfaced degraded coverage.
      - name: Refresh Universe
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MAX_UNIVERSE: '25000'
        timeout-minutes: 20
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::warning::FINNHUB_API_KEY not set — universe refresh will skip Finnhub source (degraded coverage). Set the secret in Settings → Secrets → Actions to enable."
          fi
          node refresh-universe.js --watchlist watchlist.json
        continue-on-error: true

      # audit BH-143: Prune lief frueher HIER (vor dem Fan-out) gegen ein snapshots/,
      # das in diesem Job nur die vorherige _manifest.json enthaelt — jedes echte
      # loadSnapshot(ticker) lieferte also null, wodurch die delisted-/no-active-quote-/
      # no-financial-data-Zweige NIE griffen (nur isInvalidSymbol + added_at liefen).
      # Verschoben in den merge-Job, NACH dem Download der echten gemergten Snapshots
      # (siehe dort) — dieselbe fixSketch-Empfehlung wie im Audit.

      # F-CI-003 (Tag 179/207a): hard-fail if the refreshed watchlist drops below 200
      # (refresh got nothing or watchlist.json corrupted). Schema-aware (w.stocks |
      # array | keys). This gate must trip BEFORE the matrix starts so 17 runners
      # never fan out onto a broken universe. Prune (now post-snapshot, in the merge
      # job) can only shrink further — it never repairs a refresh that got nothing.
      - name: Verify Watchlist Sanity
        run: |
          if [ ! -f watchlist.json ]; then
            echo "::error::watchlist.json is missing after refresh"
            exit 1
          fi
          size=$(node -e "const w=JSON.parse(require('fs').readFileSync('watchlist.json','utf8'));let n;if(Array.isArray(w))n=w.length;else if(w&&Array.isArray(w.stocks))n=w.stocks.length;else n=Object.keys(w).length;console.log(n)")
          echo "watchlist size: $size"
          if [ "$size" -lt 200 ]; then
            echo "::error::watchlist size $size < 200 — refresh likely corrupted the universe"
            exit 1
          fi

      # Tag 133b: ONE fresh fx-rates.json -> handed to every shard as an artifact
      # (each shard needs it for USD-mcap normalisation; don't pull it 17x against Yahoo).
      - name: Refresh FX-Rates
        run: node scripts/refresh-fx.js
        timeout-minutes: 5
        continue-on-error: true

      # F-CI-004 (Tag 179/219a): fx-rates staleness. Warn >7d, hard-fail >30d.
      # Missing/unparsable fetchedAt -> NOW (fail-open, not epoch/fail-closed).
      # audit BH-121: fruehere Version mass `stat -c %Y` (Datei-Mtime) statt des
      # `fetchedAt`-Felds. Die Mtime ist in JEDEM CI-Job frisch (Checkout UND weil
      # refresh-fx.js die Datei bei JEDEM Lauf neu schreibt, auch bei Totalausfall),
      # waehrend `fetchedAt` bei einem Fehl-Lauf eingefroren bleibt (refresh-fx.js
      # anySuccess-Gate) — der 7-/30-Tage-Check war damit strukturell unerreichbar.
      - name: Verify FX-Rates Freshness
        run: |
          if [ -f fx-rates.json ]; then
            now=$(date +%s)
            fetched=$(node -e "try{const d=require('./fx-rates.json');const t=d.fetchedAt?Date.parse(d.fetchedAt):NaN;console.log(Number.isFinite(t)?Math.floor(t/1000):$now);}catch(e){console.log($now);}")
            age_days=$(( (now - fetched) / 86400 ))
            echo "fx-rates.json fetchedAt age: ${age_days} days"
            if [ "$age_days" -gt 30 ]; then
              echo "::error::fx-rates.json fetchedAt is ${age_days} days old — refresh-fx has been failing silently"
              exit 1
            fi
            if [ "$age_days" -gt 7 ]; then
              echo "::warning::fx-rates.json fetchedAt is ${age_days} days old — refresh-fx may be intermittently failing"
            fi
          else
            echo "::warning::fx-rates.json missing — pull-yahoo will use hardcoded fallback rates"
          fi

      # Workstream A1: SEC EDGAR Form-4 daily insider pull. Once, watchlist-CIK-filtered.
      # continue-on-error: SEC outages must not block the pipeline; cache is resumable.
      - name: Pull Insider Form-4 (daily)
        env:
          DAYS: '5'
        run: node scripts/pull-insider-form4-daily.js
        timeout-minutes: 30
        continue-on-error: true

      # Tag-63: Earnings-Calendar. VERSCHOBEN vor den Fan-out (war im Single-Job NACH
      # dem Pull): earnings-calendar.json treibt die needsFullPull-Diaet -> JEDER Shard
      # braucht es als Artefakt. pull-earnings-dates.js hat einen internen Collapse-Guard
      # + atomic write (liest den committed Vorzustand aus dem prep-Checkout von main),
      # aktualisiert die Schutzlisten-Datei also nur, loescht sie nie. Der merge-Job
      # laedt sie als prep-Input zurueck und committet sie in main (einziger Commit-Pfad).
      # Tag 232c-25: EARNINGS_CONCURRENCY 20->8 (gleiche Yahoo-Cloudflare-Drossel).
      - name: Pull Earnings-Calendar
        env:
          EARNINGS_CONCURRENCY: '8'
        run: node pull-earnings-dates.js
        timeout-minutes: 20
        continue-on-error: true

      # Tag 220c: Yahoo Schema-Drift Canary (NVDA+TSM), once-only direkt vor dem Fan-out
      # statt 17x denselben Alarm. Blockt NIE (continue-on-error + exit 0). Canary
      # exit-code: 1=drift, 2=Yahoo-unreachable (non-fatal), 0=clean.
      - name: Schema-Drift Canary
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set +e
          node tests/yahoo-schema-canary.js
          canary_exit=$?
          echo "Schema-Drift Canary exit code: $canary_exit"
          if [ "$canary_exit" -eq 1 ]; then
            echo "::error::SCHEMA-CANARY DRIFT — Yahoo field(s) moved; pull-yahoo extraction may be silently corrupting data"
            if [ -z "$DISCORD_WEBHOOK" ]; then
              echo "DISCORD_WEBHOOK not set, skipping Discord notification."
            else
              curl -H "Content-Type: application/json" -X POST \
                -d "{\"content\": \"🚨 SCHEMA-CANARY DRIFT — Yahoo field(s) moved; pull-yahoo extraction may be silently corrupting data. Detected at $(date -u). See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
                "$DISCORD_WEBHOOK"
            fi
          fi
          exit 0

      # Der geteilte Zustand fuer alle Shards + den merge-Job: die EINE watchlist.json
      # (Voll-Universum-Denominator), fx-rates.json, earnings-calendar.json, insider-cache.
      # Shards laden AUSSCHLIESSLICH dieses Artefakt (nicht ihren eigenen Checkout-Stand),
      # damit Refresh/Prune/FX/Earnings konsistent ueber alle 17 sind.
      - name: Upload prep state (watchlist + fx + earnings + insider)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prep-state
          path: |
            watchlist.json
            fx-rates.json
            earnings-calendar.json
            external-data/sec-form4-cache.json
          if-no-files-found: warn
          retention-days: 1

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK not set, skipping notification."; exit 0; fi
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"⚠ Yahoo-Pull PREP failed at $(date -u). See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"

  # ============================================================================
  # PULL (matrix, N shards in parallel) — the ONLY parallelised work.
  # node pull-yahoo.js --shard i/N reads the full watchlist.json and slices it
  # INTERNALLY (shardStocks: hash(ticker)%N===i) to the i-th disjoint slice.
  # fail-fast:false — one slow/red shard must NOT kill the others. Each shard:
  # own namespaced cache (cross-run warm-up without foreign tickers), own snapshot
  # artifact, own manifest artifact (renamed shard-<i>.json for the flat merge).
  # No once-only step lives here.
  # ============================================================================
  pull:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shard_matrix) }}
    env:
      # Tag 215f: PULL_CONCURRENCY 20->8 (Yahoo Cloudflare Edge rate-limited at 20).
      PULL_CONCURRENCY: '8'
      RUN_DATE_UTC: ${{ needs.prep.outputs.run_date }}
      SHARD_COUNT: ${{ needs.prep.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Prep-Zustand ueberschreibt den Checkout-Stand: dieselbe watchlist.json/fx/earnings
      # fuer ALLE Shards -> identischer Split + korrekte mcap-Normierung + Diaet.
      - name: Download prep state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prep-state
          path: .

      # Guard (RED-TEAM-0 T2-E / RED-TEAM-2 T1-b): assert this shard index is in
      # range for N. parseArgs falls back to a FULL-universe pull on an invalid
      # --shard (poisons this shard's cache with 23.7k foreign tickers, forever).
      # The fromJSON matrix already keeps them in sync; this is defence-in-depth
      # in case someone hand-edits the matrix. Hard-fail before the pull.
      - name: Assert shard index in range
        run: |
          if [ "${{ matrix.shard }}" -ge "$SHARD_COUNT" ] || [ "${{ matrix.shard }}" -lt 0 ]; then
            echo "::error::shard index ${{ matrix.shard }} out of range for N=$SHARD_COUNT — would trigger a full-universe pull. Aborting."
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/$SHARD_COUNT in range."

      # Cross-run persistence PER SHARD. Tag 261: restore-only + separater save mit
      # if:always() (sonst Bootstrapping-Deadlock: @v4-post-save nur bei Job-Erfolg).
      # WICHTIG: key/restore-keys sind pro Shard namespaced. Der TRENNENDE Bindestrich
      # nach dem Index ist load-bearing — `snapshots-shard-1-` ist KEIN Praefix von
      # `snapshots-shard-10-` (naechstes Zeichen ist '0' != '-'), sonst restaurierte
      # Shard 1 den Cache von Shard 10..16 (fremde, disjunkte Ticker -> alles Voll-Pull).
      - name: Restore snapshot cache (shard ${{ matrix.shard }}, per-shard namespaced)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: snapshots
          key: snapshots-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            snapshots-shard-${{ matrix.shard }}-

      # 0.2/0.9 Sharding: --shard i/N liest die VOLLE watchlist.json und sliced INTERN
      # auf die i-te disjunkte Scheibe (~1394 Ticker). Das Shard-_manifest.json traegt
      # n_total = SHARD-Groesse; der merge-Job zaehlt auf Voll-Universum um.
      # FUNDAMENTALS_REFRESH_BUDGET (RED-TEAM-0 T1-A): der Default in pull-yahoo.js ist
      # 1500 und cappt zeitbasierte Full-Pulls. Bei Kaltstart will jeder der ~1394-1470
      # Ticker eines Shards voll gezogen werden — nah am 1500-Cap; waechst das Universum
      # Richtung MAX_UNIVERSE 25000 (~1470/Shard), koennten ueberzaehlige als price-only
      # ohne Vor-Snapshot als `failed` zurueckkommen (getarnte Fail-Mass). Auf 3000 heben
      # (> groesste plausible Shard-Groesse) -> der Kaltstart endet am 165-min-Timeout,
      # nie am Budget-Cap. Kostet nichts (reine Schutz-Obergrenze).
      - name: Run Yahoo Pull (shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }})
        env:
          FUNDAMENTALS_MAX_AGE_DAYS: '7'
          # 2026-06: market-cap floor $1B → $800M (broader US small/mid-cap set).
          MIN_MCAP_USD: '800000000'
          FUNDAMENTALS_REFRESH_BUDGET: '3000'
        run: node --max-old-space-size=6144 pull-yahoo.js --shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }} --watchlist watchlist.json --output snapshots --rate-limit 2000
        continue-on-error: true
        timeout-minutes: 165

      # Tag 261: Shard-Snapshots persistieren REGARDLESS des spaeteren Gate-Outcomes
      # (if:always()). Per-run key -> neuer Eintrag; naechster Lauf holt ihn via
      # restore-keys und price-onlyt diese ~1394 Ticker billig (Diaet greift).
      - name: Save snapshot cache (shard ${{ matrix.shard }}, always — persists even on gate-fail)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: snapshots
          key: snapshots-shard-${{ matrix.shard }}-${{ github.run_id }}

      # F-CI-016 (Tag 192/218, Tag 285): per-Shard-Frische-Frühwarnung. <50% frisch
      # (<36h Pull-Uhr) -> dieser Shard war ein No-Op. continue-on-error:true — nur
      # Log/rotes-Shard-X; das HARTE gemergte Freshness-Gate sitzt im merge-Job (sonst
      # wuerde ein einzelner halb-staler Shard das ganze Universum blocken). Der Upload
      # unten ist if:always(), also blockt ein rotes Shard-X den Upload nicht.
      # Tag 285: Logik nach scripts/verify-freshness.js extrahiert (liest asOf =
      # Pull-Uhr, nicht fetchedAt = Voll-Pull-Uhr — Pull-Diaet-Konflikt, falsch-rot 10.07.).
      - name: Verify Snapshot Freshness (shard ${{ matrix.shard }})
        continue-on-error: true
        run: node scripts/verify-freshness.js ./snapshots "shard ${{ matrix.shard }}"

      # Shard-Manifest eindeutig auf shard-<i>.json umbenennen — der merge-Umzaehler
      # liest ein Verzeichnis FLACH (readdirSync .json). if:always() -> auch ein
      # getimeouteter Shard liefert sein (partial) Manifest.
      - name: Stage shard manifest for merge
        if: always()
        run: |
          mkdir -p shard-manifest-out
          if [ -f snapshots/_manifest.json ]; then
            cp snapshots/_manifest.json shard-manifest-out/shard-${{ matrix.shard }}.json
            echo "Staged shard-${{ matrix.shard }}.json"
          else
            echo "no manifest for shard ${{ matrix.shard }} (timeout before first flush) — merge counts it as a missing shard (partial=true)"
          fi

      # Shard-Snapshots hochladen — OHNE die Manifeste (Glob-Negation), sonst
      # kollidieren 17 _manifest.json / _manifest-full.json beim merge-multiple-Download
      # (RED-TEAM-2 T1-a). Die Ticker-Snapshots sind disjunkt -> keine echte Kollision.
      - name: Upload shard snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots-shard-${{ matrix.shard }}
          path: |
            snapshots/*.json
            !snapshots/_manifest.json
            !snapshots/_manifest-full.json
          if-no-files-found: warn
          retention-days: 1

      # Shard-Manifest als eigenes Artefakt (getrennt von den Snapshots). Der merge-Job
      # laedt alle via pattern + merge-multiple FLACH nach shard-manifests/.
      - name: Upload shard manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-manifest-${{ matrix.shard }}
          path: shard-manifest-out/
          if-no-files-found: warn
          retention-days: 1

  # ============================================================================
  # MERGE (once, after all shards) — collects every shard artifact, recounts ONE
  # full-universe manifest, runs the coverage gate + the entire once-only
  # downstream chain + the SINGLE commit-to-main + gh-pages deploy 1/2.
  # if: always() && needs.prep.result == 'success' — runs even with 1-2 missing
  # shard artifacts (coverage-gate catches partial coverage), but NOT if prep hard-
  # failed (no universe = merge is meaningless, and prep-state would be missing).
  # ============================================================================
  merge:
    needs: [prep, pull]
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_DATE_UTC: ${{ needs.prep.outputs.run_date }}
      SHARD_COUNT: ${{ needs.prep.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # full history for the retry-rebase push to main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # prep-state zurueckholen: die volle watchlist.json ist der Voll-Universum-
      # Denominator fuer coverage-gate + Umzaehler; fx/earnings/insider fuer downstream
      # + den Commit (earnings-calendar.json wird hier in main committet).
      - name: Download prep state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prep-state
          path: .

      # Alle Shard-Snapshot-Segmente in EINEN snapshots/-Ordner mergen. Disjunkt
      # (pull-shard.test.js beweist die Partition) -> keine Dateikollision; falls doch,
      # faengt der merge-Helfer sie (on-disk < summierte n_ok -> exit 1).
      - name: Download all shard snapshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: snapshots-shard-*
          path: snapshots
          merge-multiple: true

      # audit BH-143 (verschoben von Tag 142/prep — siehe Kommentar dort): Prune lief
      # frueher im prep-Job VOR dem Fan-out, wo snapshots/ nur die alte _manifest.json
      # enthaelt -> loadSnapshot() lieferte fuer jeden echten Ticker null, delisted-/
      # no-active-quote-/no-financial-data-Erkennung griff nie. Hier, NACH dem Download
      # der echten gemergten Shard-Snapshots, laufen die Standardpfade von
      # prune-watchlist.js (./watchlist.json, ./snapshots) — beide liegen an dieser
      # Stelle im merge-Job bereits vor. VOR "Merge shard manifests" platziert, damit
      # dessen n_total-Umzaehlung den bereits bereinigten Voll-Universum-Nenner liest.
      - name: Prune Watchlist (post-snapshot)
        run: node scripts/prune-watchlist.js
        continue-on-error: true

      # Alle Shard-Manifeste FLACH nach shard-manifests/ (merge-multiple legt die
      # shard-<i>.json flach ab — genau was der Umzaehler-readdirSync erwartet).
      - name: Download all shard manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-manifest-*
          path: shard-manifests
          merge-multiple: true

      # KERN: Shard-Manifeste -> EIN snapshots/_manifest.json mit n_total = VOLL-
      # Universum (watchlist), n_ok/n_full/n_priceonly/n_skipped_mcap/n_failed = Summen,
      # partial = OR ueber Shards ODER (present < expected). Disjunktheits-Check gegen
      # die on-disk-Dateien. --expected-shards erzwingt partial=true bei fehlendem Shard.
      - name: Merge shard manifests (recount n_total to full universe)
        run: |
          node scripts/merge-shard-manifests.js \
            --shard-manifests shard-manifests \
            --snapshots snapshots \
            --watchlist watchlist.json \
            --expected-shards "$SHARD_COUNT"

      # F-CI-002: stale/leeres Manifest -> file-count-Fallback. Nach dem Umzaehler
      # liegt hier immer ein frisches gemergtes Manifest; dieser Check ist der
      # Vollstaendigkeits-Log fuer den Fallback-Pfad.
      - name: Check Manifest Freshness
        run: |
          if [ -f snapshots/_manifest.json ]; then
            echo "Merged manifest present (recounted to full universe)."
          else
            echo "No merged manifest — coverage gate will use the file-count fallback."
          fi

      # F-CI-016 (Tag 192/218, Tag 285): GEMERGTES Snapshot-Freshness-Gate ueber das
      # VEREINTE Universum (nicht je Shard). 9 Shards je knapp ≥50% frisch waeren gemergt
      # zur Haelfte stale -> genau der Fehlermodus, gegen den F-CI-016 gebaut ist. Hier
      # hart (continue-on-error:false): <50% frisch -> Deploy blockt, keine stale Daten.
      # Tag 285: Logik nach scripts/verify-freshness.js extrahiert. Root-Cause-Fix
      # falsch-rot 10.07.: der alte Inline-Regex las fetchedAt (Voll-Pull-Uhr, von der
      # 0.9-Pull-Diaet absichtlich NICHT taeglich erneuert) statt asOf (Pull-Uhr, die
      # _priceOnlyUpdate taeglich stempelt) — das Gate mass Fundamentals- statt
      # Pull-Frische. Schutz bleibt: Pull versagt -> nichts gestempelt -> rot.
      - name: Verify Snapshot Freshness (merged)
        continue-on-error: false
        run: node scripts/verify-freshness.js ./snapshots "Merged snapshot"

      # Frage 11 two-stage coverage gate — liest das umgezaehlte Manifest + volle
      # watchlist. KATASTROPHAL -> exit1 blockt Deploy; DEGRADIERT/OK -> exit0.
      # Signal: red-X + outputs/coverage-status.json (Karls einziger Alarm-Kanal).
      - name: Verify Pull Coverage (two-stage)
        run: node scripts/coverage-gate.js

      # Tag-39: Historical-Price-Pull ueber das zusammengefuehrte Universum. Einmalige
      # Yahoo-Last (NICHT je Shard). Tag 232c-25: PRICE_CONCURRENCY 20->8.
      - name: Pull Historical Prices
        env:
          PRICE_CONCURRENCY: '8'
        run: node pull-historical-prices.js --out prices --rate-limit 1500
        timeout-minutes: 25
        continue-on-error: true

      # Tag 139: Macro-Regime-Tagging — SPY 200d-MA → BULL/BEAR/SIDEWAYS.
      - name: Compute Macro Regime
        run: node scripts/macro-regime.js
        continue-on-error: true

      # Tag 133g: Pull-Stats Monitoring — Discord-Alert wenn ein Pull-Output >25% vs
      # 4-Week-Median shrinkt. Aggregiert ueber das gemergte Set.
      - name: Pull-Stats Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ALLOW_PULL_DRIFT: ${{ vars.ALLOW_PULL_DRIFT || '0' }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK not configured — Discord alerts disabled."; fi
          node scripts/check-pull-stats.js
        continue-on-error: true

      # Tag 134: prices/ 14d archivieren; frozen methods/picks-history unangetastet
      # (100000d = effektiv unendlich -> SCHUTZLISTE wird nur aktualisiert, nie geloescht).
      - name: Archive Old Snapshots
        run: node scripts/archive-old-snapshots.js --keep-days 14 --methods-keep-days 100000 --picks-keep-days 100000
        continue-on-error: true

      # Task 0.8: drei pure-node Coverage-Canaries ueber das GEMERGTE Universum. Jeder
      # schreibt seine data-health/-Baseline VOR dem ::error::-Drift-Check (landet im
      # git add -A). continue-on-error: ein Watcher-Crash darf den Data-Commit nicht blocken.
      - name: Watch Exchange Coverage
        run: node scripts/watch-exchange-coverage.js
        continue-on-error: true

      - name: Watch Unrouted Quote Share
        run: node scripts/watch-unrouted-quote.js
        continue-on-error: true

      - name: Watch FX Sanity
        run: node scripts/watch-fx-sanity.js
        continue-on-error: true

      # 2.2: ATH-State billig fortschreiben (nur Ticker, die der lokale Max-Batch
      # geseedet hat; Split-Wächter flaggt Re-Basierungen). Anzeige-Daten -> fail-soft.
      # external-data/ath-state.json ist getrackt und faehrt im git add -A unten mit.
      - name: Update ATH State (2.2)
        run: node scripts/update-ath-state.js
        continue-on-error: true

      # F-CI-001 v2 (Tag 179/232c-7): DER EINZIGE Commit-to-main, retry-rebase,
      # tree-verified. Nur der merge-Job pusht auf main -> kein 17-Shard-Race.
      # Schutzliste (picks-history/, methods-history/, earnings-calendar.json) wird
      # nur aktualisiert, nie geloescht. git add -A committet auch die frisch von prep
      # durchgereichte earnings-calendar.json + fx-rates.json + insider-cache.
      - name: Commit Snapshots
        run: |
          git config user.name "yahoo-pull-bot"
          git config user.email "yahoo-pull-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: yahoo-pull $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            COMMIT_SHA=$(git rev-parse HEAD)
            COMMIT_TREE=$(git rev-parse HEAD^{tree})
            echo "Local commit to publish: $COMMIT_SHA (tree $COMMIT_TREE)"
            for i in 1 2 3; do
              git fetch origin main
              # Tag 232c-7: plain rebase (no --strategy-option theirs, which would
              # silently drop our bytes on conflict). Verify BOTH the commit object
              # survived AND its tree hash is unchanged; else abort + cherry-pick.
              if ! git rebase --autostash origin/main; then
                echo "::warning::Rebase failed on attempt $i — aborting cleanly (preserves local commit)"
                git rebase --abort || true
                NEW_TREE=$(git log -1 --format=%T "$COMMIT_SHA" 2>/dev/null || echo "MISSING")
                if ! git merge-base --is-ancestor "$COMMIT_SHA" HEAD || [ "$NEW_TREE" != "$COMMIT_TREE" ]; then
                  echo "::warning::Local commit lost or mutated during rebase — restoring from $COMMIT_SHA (tree $COMMIT_TREE)"
                  git reset --hard origin/main
                  git cherry-pick "$COMMIT_SHA" || { echo "::error::cherry-pick failed"; exit 1; }
                fi
              else
                COMMIT_SHA=$(git rev-parse HEAD)
              fi
              if git push; then
                echo "✓ Pushed on attempt $i (commit $(git rev-parse HEAD))"
                exit 0
              fi
              echo "Push attempt $i failed, retrying..."
              sleep $((5 * i))
            done
            echo "::error::Push failed after 3 attempts — local commit $COMMIT_SHA NOT on remote"
            exit 1
          fi

      # Task 0.3: upload the final merged snapshots/ so the scoring job scores them on
      # a fresh runner. Runs after Commit so it captures the complete post-pull set.
      - name: Upload Snapshots Artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots
          path: |
            snapshots/*.json
          retention-days: 1
          if-no-files-found: error

      # F4/F6 (Artefakt-Handoff merge→scoring): der scoring-Job checkt github.sha
      # (Trigger-Commit) aus und laedt NUR das snapshots-Artefakt — er sieht daher
      # WEDER die in diesem Lauf frisch fortgeschriebene external-data/ath-state.json
      # (vom merge-Commit oben, F4) NOCH outputs/macro-regime.json (gitignored, nur
      # hier erzeugt, F6). Beide als EIN Artefakt durchreichen; scoring laedt es vor
      # write-findash-export/write-board-history. Artefakt statt git-fetch = race-frei
      # gegen parallele main-Pushes. if-no-files-found: warn haelt die fail-soft-Semantik
      # der continue-on-error-Quellschritte (Compute Macro Regime, Update ATH State).
      # audit BH-118: outputs/coverage-status.json (hier von "Verify Pull Coverage"
      # geschrieben, ebenfalls gitignored) fehlte in diesem Handoff -> write-findash-
      # export.js sah im scoring-Job IMMER coverage:null, unabhaengig vom echten
      # Coverage-Stand. Aus derselben Quelle wie ath-state/macro-regime mitgeben.
      - name: Upload merge→scoring handoff (ath-state + macro-regime + coverage-status)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-handoff
          path: |
            external-data/ath-state.json
            outputs/macro-regime.json
            outputs/coverage-status.json
          if-no-files-found: warn
          retention-days: 1

      # Tag 168: Pipeline Health Check nach Commit (blockt Deploy, nicht den Data-Commit).
      - name: Pipeline Health Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not configured — health check will run without Discord alerts."
          fi
          node scripts/pipeline-health-check.js

      # Tag 146/153: gh-pages-Deploy 1 von 2 (index.html + outputs/, inkl. dem
      # coverage-status.json-Marker). Nur bei erfolgreichem Data-Commit (if:success()).
      # scoring-Deploy (2/2) laeuft danach (needs:merge) -> die zwei Force-Pushes racen NICHT.
      # audit BH-113: frueher `git init -b gh-pages` + Force-Push — das ersetzte den
      # KOMPLETTEN Branch. Dieser Job faehrt den Scorer NICHT, sein outputs/ enthaelt
      # also nur ~6 Dateien (coverage-status/macro-regime/pull-stats) und KEIN
      # hypergrowth/findash-export — ein voller Re-Init loeschte damit die Scoring-Feeds
      # des Vorlaufs bis Deploy 2 (~2min spaeter) sie wiederherstellte; scheiterte
      # Scoring/Deploy-2 dazwischen, blieben sie 404. Jetzt: bestehenden gh-pages-Branch
      # klonen und NUR index.html + outputs/ ueberschreiben — hypergrowth/findash-export
      # aus einem vorherigen scoring-Deploy bleiben im Baum erhalten.
      - name: Deploy to GitHub Pages
        if: success()
        run: |
          rm -rf _site
          # audit BH-114 (gleiche Haertung wie im scoring-Deploy unten): Branch-Existenz
          # separat pruefen. Existiert er und der Clone scheitert trotzdem (transientes
          # Netz/Auth), hart abbrechen statt einen frischen (leeren) Branch zu
          # initialisieren und einen gestrippten Tree force-zu-pushen.
          if git ls-remote --exit-code https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages >/dev/null 2>&1; then
            if ! git clone --depth 1 --branch gh-pages \
              https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git _site; then
              echo "::error::gh-pages branch exists but clone failed (transient?) — aborting instead of force-pushing a stripped tree."
              exit 1
            fi
          else
            mkdir -p _site
            cd _site
            git init -b gh-pages
            cd ..
          fi
          mkdir -p _site/outputs
          cp index.html _site/ 2>/dev/null || true
          cp -r outputs/. _site/outputs/ 2>/dev/null || true
          cd _site
          git config user.name "yahoo-pull-bot"
          git config user.email "yahoo-pull-bot@users.noreply.github.com"
          git remote get-url origin >/dev/null 2>&1 || git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          if git diff --staged --quiet; then echo "No merge-deploy changes."; exit 0; fi
          git commit -m "deploy: screener reports $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            if git push --force origin gh-pages; then
              echo "✓ GitHub Pages deployed on attempt $i"
              exit 0
            fi
            echo "gh-pages push attempt $i failed, retrying..."
            sleep $((5 * i))
          done
          echo "gh-pages push failed after 3 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK not set, skipping notification."; exit 0; fi
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"⚠ Yahoo-Pull MERGE failed at $(date -u). See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"

  # ============================================================================
  # SCORING (unchanged logic; needs: pull -> needs: merge, + snapshot source).
  # needs:merge serialises the two gh-pages force-pushes (merge-Deploy first, then
  # scoring) so they never race. Scores the merged snapshots artifact on a fresh
  # runner and publishes hypergrowth + findash-export/v1 to gh-pages.
  # ============================================================================
  scoring:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download Snapshots Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshots
          path: snapshots

      # audit BH-003: die vier Live-Universum-Anker-Suiten (score.integration/
      # quality-board/phase/score-breakdown) liefen nach dem synthetischen Pre-Pull-
      # Gate (leeres snapshots/ -> die Suiten skippen dort sauber) in KEINEM weiteren
      # Job — ein realdatenabhaengiger Ranking-/Routing-/Dedup-/Board-Regress konnte
      # so mit vollstaendig gruenem CI deployen. Hier, direkt nach dem Download der
      # gemergten Snapshots, erneut ausfuehren: in DIESEM Job ist das Universum real
      # (Coverage-Gate im merge-Job hat es bereits als hinreichend bestaetigt), ein
      # "kein Universum"-Skip ist hier also kein legitimer Pre-Pull-Zustand mehr,
      # sondern selbst ein Befund und wird als Fehler behandelt. Das synthetische
      # Pre-Pull-Gate bleibt unveraendert bestehen.
      - name: Live-Universum-Gate (score.integration/quality-board/phase/score-breakdown)
        run: |
          fail=0
          for t in tests/scoring/score.integration.test.js tests/scoring/quality-board.test.js tests/scoring/phase.test.js tests/scoring/score-breakdown.test.js; do
            echo "--- $t ---"
            set +e
            out=$(node "$t" 2>&1)
            rc=$?
            set -e
            echo "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::Live-Universum-Test failed: $t (exit $rc)"
              fail=1
            fi
            if echo "$out" | grep -q 'pre-pull-Gate'; then
              echo "::error::$t skipped its live-universe anchor(s) in the scoring job — real snapshots were expected here. Treating as failure."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Live-Universum-Gate failed — a ranking/routing/dedup/board regression may be present. See above."
            exit 1
          fi
          echo "Live-Universum-Gate OK (real snapshots, no skip)."

      # F4/F6: die im merge-Job frisch erzeugten Handoff-Dateien holen, BEVOR die
      # Reader laufen — external-data/ath-state.json (write-findash-export.js:78, F4)
      # und outputs/macro-regime.json (write-board-history.js:368, F6). Landet dank
      # der beibehaltenen Artefakt-Pfade exakt am Lese-Ort (path: .). run-screener.js
      # schreibt macro-regime.json nicht, ueberschreibt es also nicht. continue-on-error:
      # fehlt das Artefakt ausnahmsweise, fallen beide Reader auf ihr bisheriges
      # Verhalten zurueck (ath: alter committeter Stand; regime: 'unknown') — kein
      # NEUER Hart-Abbruch im scoring-Job, die fail-soft-Semantik bleibt unveraendert.
      # audit BH-118: outputs/coverage-status.json faehrt jetzt im selben Artefakt mit
      # (write-findash-export.js loadCoverage()) — fehlt es, bleibt coverage:null wie
      # bisher (fail-soft, kein neuer Hart-Abbruch).
      - name: Download merge→scoring handoff (ath-state + macro-regime + coverage-status)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: merge-handoff
          path: .

      - name: Run Hypergrowth Screener
        run: |
          node src/scoring/run-screener.js
          count=$(ls outputs/hypergrowth/*.json 2>/dev/null | wc -l)
          echo "Scoring wrote $count JSON files to outputs/hypergrowth/"
          if [ "$count" -lt 3 ]; then
            echo "::error::Scoring produced $count outputs/hypergrowth/*.json (expected >=3) — engine failed or universe empty."
            exit 1
          fi

      - name: Build findash-export v1
        run: |
          node scripts/write-findash-export.js
          count=$(ls outputs/findash-export/v1/*.json 2>/dev/null | wc -l)
          echo "findash-export wrote $count JSON files to outputs/findash-export/v1/"
          if [ "$count" -lt 15 ]; then
            echo "::error::findash-export produced $count files (expected 15) — writer failed."
            exit 1
          fi
          # 3.2 QC-Board (quality/): expected = #QC boards + overview + index. Dynamic, no
          # hardcode-drift — derive from the source quality-*.json count (0 = no QC pass this run).
          # F11: ein QC-Fehl-Lauf schreibt outputs/quality/_failed (run-screener catch) und
          # exportiert quality/ NUR als _failed-Marker (write-findash-export) — dann gibt es
          # KEINEN Board-Count-Vertrag zu pruefen (QC ist als gescheitert ausgewiesen, HG liefert
          # weiter). Nur OHNE _failed-Marker UND mit QC-Quellboards ist der vollstaendige
          # quality/-Export Pflicht.
          qsrc=$(ls outputs/quality/quality-*.json 2>/dev/null | wc -l)
          if [ ! -f outputs/quality/_failed ] && [ "$qsrc" -gt 0 ]; then
            qexp=$((qsrc + 2))
            qgot=$(ls outputs/findash-export/v1/quality/*.json 2>/dev/null | wc -l)
            echo "findash-export quality/ wrote $qgot files (expected $qexp)"
            if [ "$qgot" -ne "$qexp" ]; then
              echo "::error::findash-export quality/ produced $qgot files (expected $qexp) — QC export failed."
              exit 1
            fi
          fi

      - name: Verify findash-export v1 schema (contract gate)
        run: node scripts/write-findash-export.js --check

      # audit BH-114: frueher fing `|| { git init -b gh-pages }` JEDEN Clone-Fehler ab
      # — auch transiente DNS/Auth/Netz-Aussetzer, nicht nur einen tatsaechlich
      # fehlenden Branch. Ein transienter Fehler fuehrte dann zum Force-Push eines
      # gestrippten Trees (nur hypergrowth+findash-export), der index.html/
      # coverage-status.json/macro-regime/pull-stats geloescht haette. Jetzt: Branch-
      # Existenz separat pruefen; existiert er und der Clone scheitert trotzdem, hart
      # abbrechen statt destruktiv zu re-initialisieren.
      - name: Deploy Scoring Output to GitHub Pages
        if: success()
        run: |
          rm -rf _ghp
          if git ls-remote --exit-code https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages >/dev/null 2>&1; then
            if ! git clone --depth 1 --branch gh-pages \
              https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git _ghp; then
              echo "::error::gh-pages branch exists but clone failed (transient?) — aborting instead of force-pushing a stripped tree."
              exit 1
            fi
          else
            mkdir -p _ghp
            cd _ghp
            git init -b gh-pages
            cd ..
          fi
          mkdir -p _ghp/outputs/hypergrowth
          cp outputs/hypergrowth/*.json _ghp/outputs/hypergrowth/
          # F11: Ziel-v1 VOR dem Kopieren leeren — sonst ueberleben aus dem frischen Export
          # verschwundene Dateien (v.a. das optionale quality/-Board bei einem QC-Fehl-Lauf)
          # aus dem alten gh-pages-Checkout und werden als frisch weiter-serviert (stiller
          # Stale-Feed). Nach dem rm ist der deployte v1-Stand exakt der DIESES Laufs; HG bleibt
          # unberuehrt (BRANCHES+overview+survival+index werden jeden Lauf voll neu geschrieben).
          rm -rf _ghp/outputs/findash-export/v1
          mkdir -p _ghp/outputs/findash-export/v1
          cp -r outputs/findash-export/v1/. _ghp/outputs/findash-export/v1/
          cd _ghp
          git config user.name "yahoo-pull-bot"
          git config user.email "yahoo-pull-bot@users.noreply.github.com"
          git remote get-url origin >/dev/null 2>&1 || git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          if git diff --staged --quiet; then echo "No scoring output changes to deploy."; exit 0; fi
          git commit -m "deploy: hypergrowth scoring $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            if git push --force origin gh-pages; then
              echo "✓ Scoring output deployed on attempt $i"
              exit 0
            fi
            echo "gh-pages push attempt $i failed, retrying..."
            sleep $((5 * i))
          done
          echo "::error::gh-pages scoring deploy failed after 3 attempts"
          exit 1

      # ── 2.3 Vintage-Messreihe (scharf seit Tag 303; Writer Tag 298, 2.8-Spec) ──
      # NACH dem gh-pages-Deploy: ein suspect-Vintage (exit 2) macht den Job am Ende
      # fail-loud ROT (0.7-Kanal), darf aber weder Board-Deploy noch Vintage-Commit
      # verhindern. ANGENOMMEN: scoring laeuft strikt NACH dem merge-Push (needs:)
      # -> zweiter, serialisierter main-Pusher ohne Shard-Race; exakt dieselbe
      # Haertung (retry-rebase, tree-verified) wie der merge-Commit (F-CI-001 v2).
      # Falls falsch: zeigt sich als Push-Retry-Fail = roter Job, nie stiller Verlust.
      # L17: gezieltes `git add board-history/` — NIE -A (_ghp/-Scratch liegt im Tree).
      - name: Write board-history vintage (2.3)
        id: vintage
        run: |
          # audit BH-156: `date -u +%F` unmittelbar vor dem Aufruf gestempelt — deckt
          # sich mit write-board-history.js' eigenem isoDay(Date.now()) (kein --date
          # uebergeben, das Skript nutzt also dieselbe Wanduhr). Als Output verfuegbar
          # fuer den Commit-Step unten (praeziser als das Stunden-alte RUN_DATE_UTC,
          # das dieser Job gar nicht sieht).
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          set +e
          node scripts/write-board-history.js
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            echo "::error::write-board-history hard-failed rc=$rc (kein Vintage geschrieben)"
            exit "$rc"
          fi

      - name: Commit board-history vintage to main
        run: |
          git config user.name "yahoo-pull-bot"
          git config user.email "yahoo-pull-bot@users.noreply.github.com"
          # audit BH-156: SUSPECT (rc=2) darf laut Masterplan-Akzeptanz "geflaggt/nicht
          # committet" bleiben. Frueher committete+pushte dieser Step BEDINGUNGSLOS und
          # wurde erst DANACH rot (exit 2) — der suspect Tages-Delta war also schon in
          # main und floss (rank-ic.js schliesst suspect nicht automatisch aus, nur ueber
          # eine manuelle _excluded.json-Eintragung) in die Gate-Kalibrierung ein. Bei
          # rc=2 wird das Tagesverzeichnis jetzt vom Commit ausgenommen (Dateien bleiben
          # lokal auf dem Runner, verschwinden mit dessen Teardown).
          VINTAGE_DATE="${{ steps.vintage.outputs.date }}"
          if [ "${{ steps.vintage.outputs.rc }}" = "2" ]; then
            echo "::warning::board-history vintage SUSPECT geflaggt (Wert-Gate) fuer $VINTAGE_DATE — wird NICHT committet."
            git add board-history/ ":(exclude)board-history/$VINTAGE_DATE"
          else
            git add board-history/
          fi
          if git diff --staged --quiet; then
            echo "No vintage changes to commit."
          else
            git commit -m "chore: board-history vintage $(date -u +%F)"
            COMMIT_SHA=$(git rev-parse HEAD)
            COMMIT_TREE=$(git rev-parse HEAD^{tree})
            ok=0
            for i in 1 2 3; do
              git fetch origin main
              if ! git rebase --autostash origin/main; then
                echo "::warning::vintage rebase failed on attempt $i — aborting cleanly"
                git rebase --abort || true
                NEW_TREE=$(git log -1 --format=%T "$COMMIT_SHA" 2>/dev/null || echo "MISSING")
                if ! git merge-base --is-ancestor "$COMMIT_SHA" HEAD || [ "$NEW_TREE" != "$COMMIT_TREE" ]; then
                  git reset --hard origin/main
                  git cherry-pick "$COMMIT_SHA" || { echo "::error::vintage cherry-pick failed"; exit 1; }
                fi
              else
                COMMIT_SHA=$(git rev-parse HEAD)
              fi
              if git push origin HEAD:main; then ok=1; break; fi
              echo "vintage push attempt $i failed, retrying…"
              sleep $((5 * i))
            done
            if [ "$ok" != "1" ]; then
              echo "::error::board-history vintage push failed after 3 attempts"
              exit 1
            fi
            echo "✓ board-history vintage committed to main"
          fi
          if [ "${{ steps.vintage.outputs.rc }}" = "2" ]; then
            echo "::error::board-history vintage SUSPECT geflaggt (Wert-Gate) fuer $VINTAGE_DATE — NICHT committet, bitte pruefen."
            exit 2
          fi
