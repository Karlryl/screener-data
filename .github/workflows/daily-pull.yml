name: Daily Yahoo Pull

on:
  schedule:
    - cron: '17 2 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write

# Tag 153: serialize pushes to main — daily + monthly-sec-xbrl both push via retry-rebase.
# On the 1st of the month both fire within ~90 min of each other; without this one silently fails.
# Tag 219a (audit F-218c-03): manual workflow_dispatch runs get a per-run group so
# operators can re-run while a scheduled pull is in flight (otherwise the manual
# dispatch sits queued for up to 180 min waiting for the cron run, and on the
# free-plan can be evicted entirely). Scheduled cron runs still serialize on
# 'main-push' so daily + monthly-sec-xbrl don't clobber each other; the
# retry-with-rebase push loop handles the race the dispatch path can introduce.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || 'main-push' }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # Tag 219 (Run #108 timeout post-mortem): Tag 215f's PULL_CONCURRENCY 20→8
    # made Yahoo Pull take ~163min (was ~75-90min at conc=20 but with 7,210
    # rate-limit fails). That eats 163/180 of the job budget, leaving only
    # 17min for the 17 downstream steps (Pull Historical Prices alone needs
    # ~10-20min). Run #108 SIGKILL'd 1min into Pull Historical Prices —
    # snapshots from Yahoo Pull were never committed. Raised to 240min so
    # the downstream chain has ~75min of breathing room.
    timeout-minutes: 240
    env:
      # Tag 215f: lowered from 20 → 8. Run #107 produced 7,210 rate-limit
      # failures (82% of 8,769 total fails) because Yahoo's Cloudflare Edge
      # could not sustain 20 concurrent requests. With 8-way concurrency the
      # request rate stays well under Yahoo's throttle threshold. Empirical
      # from Tag 147 era: 8 was the original hardcoded default before being
      # raised to 20. The Tag 163 retry budget (5s/12s) is too short for
      # CDN-edge 429s — Tag 215f also extends to 15s/45s (see pull-yahoo.js).
      PULL_CONCURRENCY: '8'
    steps:
      # Tag 219 (audit F-219b-01 HIGH): freeze a shared run-date at job start
      # so all snapshot-* scripts agree on TODAY's date, even if the Yahoo
      # pull crosses UTC midnight (~3h pull starting 22:00 UTC, finishing
      # 01:00 UTC the next day would yield picks-history/2026-05-17.json
      # but methods-history/2026-05-18.json — silently breaking pick-diff's
      # findMethodFile lookup and method-effectiveness's vintage cache).
      # Loop A removed the snapshot-* writers; RUN_DATE_UTC is now honored by
      # archive-old-snapshots.js and pull-historical-prices.js. Kept frozen so any
      # Loop-B snapshot writer can opt in and stay midnight-safe.
      - name: Freeze Run Date
        run: |
          RUN_DATE_UTC=$(date -u +%Y-%m-%d)
          echo "RUN_DATE_UTC=$RUN_DATE_UTC" >> $GITHUB_ENV
          echo "Frozen run date: $RUN_DATE_UTC"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # F-CI-004: full history required for git-log operations and reliable rebase
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # F-CI-011: cache npm dependencies to save ~30-90s per run
          cache: 'npm'


      - name: Verify Node version
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Loop A (hypergrowth pivot): removed the pre-pull engine/method test gate
      # (engine-cli-tests.js, tag21/22/28-tests.js). Those tested the deleted
      # quality-compounder scoring layer. Loop B wires its own pre-pull gate
      # (tests/scoring/*) once the new hypergrowth engine is in place.

      # Task 0.3 (Loop B): PRE-pull scoring test-gate. Every tests/scoring/*.test.js
      # is a self-running node script ending in process.exit(fail ? 1 : 0). The glob
      # skips the fixtures/ subdir. A broken engine must block the run (::error:: +
      # exit 1) BEFORE the expensive Yahoo pull. Signal path is GitHub red-X only.
      - name: Scoring Test-Gate (pre-pull)
        run: |
          fail=0
          for t in tests/scoring/*.test.js; do
            echo "--- $t ---"
            if node "$t"; then
              echo "PASS $t"
            else
              echo "::error::Scoring test failed: $t — blocking run before Yahoo pull"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more tests/scoring/*.test.js failed — hypergrowth engine is broken, aborting run."
            exit 1
          fi
          echo "All scoring tests passed."

      # Coverage-Marker-Vertrag (coverage-status/v1) pre-pull pinnen. Der Marker
      # outputs/coverage-status.json ist Karls EINZIGER sanktionierter Alarm-Kanal
      # (Dashboard-Degradiert-Banner; kein Mail/Discord) — ein stiller Schema-Bruch
      # schaltet den Banner lautlos ab (Fail-silent). Der Selftest ist rein/synthetisch
      # (kein Universum noetig) und laeuft in <1s.
      - name: Coverage-Marker Contract Selftest
        run: node scripts/coverage-gate.js --selftest

      # 0.9 STRUKTUR-FIX (Messung Run 28785631448: full=1371 price-only=0 -> 5.8%
      # katastrophal): snapshots/ ist gitignored und wird pro Lauf NICHT persistiert
      # -> jeder CI-Lauf startet mit LEEREM snapshots/ -> jeder Ticker ist ein Erst-/
      # Voll-Pull (~7s), 0 price-only, nur ~1371 in 165min. Die Pull-Diaet (needsFullPull/
      # Budget/earnings) kann strukturell nie greifen, weil sie PERSISTENTE Snapshots
      # voraussetzt (Tag-164 "volle Coverage ueber ~3 Tage" gilt nur MIT Persistenz).
      # FUNDAMENTALS_REFRESH_BUDGET ist in CI daher wirkungslos (kappt nur zeitbasierte
      # Fulls auf vorhandenen jungen Snapshots).
      # Fix: snapshots/ per actions/cache ueber Laeufe hinweg persistieren. Lauf N
      # price-onlyt die Snapshots von N-1 (schnell) und pullt nur stale/neue voll ->
      # Coverage akkumuliert oldest-first bis voll. RESTORE hier (NACH dem Scoring-Gate,
      # damit das Gate deterministisch gegen leeres snapshots/ laeuft), VOR dem Pull.
      # key ist pro Run eindeutig; restore-keys holt den JUENGSTEN vorherigen Cache.
      # WICHTIG (Tag 261): actions/cache@v4 speichert im Post-Step NUR bei Job-Erfolg — und
      # dieser Job faellt beim Kaltstart am Coverage-Gate (1377 < Floor), also wurde der
      # Snapshot-Cache NIE gespeichert (`gh cache list`: kein snapshots-* Eintrag) -> das
      # Universum blieb ewig leer, price-only=0, permanente 1377-Decke (Bootstrapping-Deadlock).
      # Fix: restore-only hier + separater save-Step mit `if: always()` NACH dem Pull, damit die
      # gezogenen Snapshots auch bei Gate-Fail persistieren und ueber Laeufe akkumulieren.
      # Kaltstart: die ersten ~2 Laeufe bleiben rot (Cache fuellt sich jetzt WIRKLICH), ab
      # ~Lauf 3 ueberschreitet die Coverage den Floor -> gruen und danach selbsttragend.
      - name: Restore snapshot cache (cross-run persistence for the pull-diet)
        uses: actions/cache/restore@v4
        with:
          path: snapshots
          key: snapshots-${{ github.run_id }}
          restore-keys: |
            snapshots-

      # Tag 132: Auto-Universe-Refresh — laeuft bei jedem Run (schedule + workflow_dispatch).
      # Tag 133: Merged mit SEC EDGAR, Finnhub, Wikipedia Indices.
      # Tag 165: OTC Markets (OTCQX/OTCQB/Expert) + NASDAQ Screener API added.
      #          Target universe raised to 12,000+ tickers.
      # Tag 227a (silent-cap audit): MAX_UNIVERSE raised 13000 -> 25000. The cap
      # is applied to the *discovered* candidate set in refresh-universe.js (top
      # N by mcap, plus a 20% null-mcap slice). With today's watchlist already
      # at 15,734 — and the SEC/Finnhub/OTC sources contributing ~20-25k raw
      # candidates per run — the 13k cap was silently dropping every newly-IPO'd
      # ticker on the bottom rung (the existing 15.7k watchlist already exceeds
      # the cap, so new tickers were competing for slots the cap had pre-filled).
      # Precedent: memory `ci_coverage_gate_calibration.md` (audit Tag 215e
      # `max(absolute, percent)` dual gate). 25k gives 2-3 years of universe-
      # growth headroom; Node OOM is mitigated by the `--max-old-space-size=6144`
      # on pull-yahoo.js and refresh-universe.js's own 20% null-mcap proportional
      # split.
      # FINNHUB_API_KEY: GitHub Secret (Settings → Secrets → Actions → FINNHUB_API_KEY)
      # Tag 232c-18 (audit F-CI-004 MEDIUM): warn when the Finnhub secret is
      # not set so the operator sees universe-refresh is running degraded
      # (without Finnhub, only SEC/Wikipedia/OTC/NASDAQ sources contribute).
      # Doesn't block the run — refresh-universe has its own fallbacks — just
      # surfaces the silent degradation in the log.
      - name: Refresh Universe
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MAX_UNIVERSE: '25000'
        timeout-minutes: 20
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::warning::FINNHUB_API_KEY not set — universe refresh will skip Finnhub source (degraded coverage). Set the secret in Settings → Secrets → Actions to enable."
          fi
          node refresh-universe.js --watchlist watchlist.json
        continue-on-error: true

      # Tag 142: Prune delisted/stale tickers before Yahoo pull
      - name: Prune Watchlist
        run: node scripts/prune-watchlist.js
        continue-on-error: true

      # F-CI-003 (Tag 179): Refresh Universe / Prune Watchlist run with continue-on-error.
      # Without a sanity check, a failure leaves a stale or degenerate watchlist that
      # silently propagates to the rest of the pipeline. Hard-fail if size dropped
      # below 200 (manual baseline floor) — that means refresh got nothing AND prune
      # ate too much, or watchlist.json got corrupted.
      - name: Verify Watchlist Sanity
        run: |
          if [ ! -f watchlist.json ]; then
            echo "::error::watchlist.json is missing after refresh+prune"
            exit 1
          fi
          # Tag 207a (CRITICAL CI FIX): the previous check used Object.keys(w).length
          # when w is not an array. The watchlist schema was wrapped into
          # { _meta, stocks: [...], lastUniverseRefresh, lastManualExpansion } — 4
          # top-level keys — so the check counted 4 < 200 → exit 1 → all 5 most
          # recent runs hard-failed despite 15,734 real stocks in w.stocks.
          # Schema-aware: prefer w.stocks (current), array (legacy), Object.keys (very old).
          size=$(node -e "const w=JSON.parse(require('fs').readFileSync('watchlist.json','utf8'));let n;if(Array.isArray(w))n=w.length;else if(w&&Array.isArray(w.stocks))n=w.stocks.length;else n=Object.keys(w).length;console.log(n)")
          echo "watchlist size: $size"
          if [ "$size" -lt 200 ]; then
            echo "::error::watchlist size $size < 200 — refresh/prune likely corrupted the universe"
            exit 1
          fi

      # Tag 133b: FX-Rates refresh — frische Yahoo-Currency-Quotes statt hardcoded.
      # Fix für stille mcap-Korruption bei non-USD-Tickern.
      - name: Refresh FX-Rates
        run: node scripts/refresh-fx.js
        timeout-minutes: 5
        continue-on-error: true

      # F-CI-004 (Tag 179): fx-rates.json staleness check. If refresh-fx silently failed
      # repeatedly, hardcoded fallbacks become source of truth which silently drifts
      # mcap normalization. Warn (not fail) if rates are older than 7 days; only fail
      # if rates older than 30 days (effectively unusable for cross-currency picks).
      - name: Verify FX-Rates Freshness
        run: |
          if [ -f fx-rates.json ]; then
            # Tag 219a (audit F-218c-06): on stat failure fall back to NOW (fail-open),
            # not 0 (epoch start / fail-closed). The outer [ -f ] already confirmed the
            # file exists; a stat failure here is almost certainly a transient permission
            # / race issue, and reporting the file as 600,000 days old would trip the
            # 30-day hard-fail downstream and kill the pipeline on a transient hiccup.
            now=$(date +%s)
            mtime=$(stat -c %Y fx-rates.json 2>/dev/null || echo "$now")
            age_days=$(( (now - mtime) / 86400 ))
            echo "fx-rates.json age: ${age_days} days"
            if [ "$age_days" -gt 30 ]; then
              echo "::error::fx-rates.json is ${age_days} days old — refresh-fx has been failing silently"
              exit 1
            fi
            if [ "$age_days" -gt 7 ]; then
              echo "::warning::fx-rates.json is ${age_days} days old — refresh-fx may be intermittently failing"
            fi
          else
            echo "::warning::fx-rates.json missing — pull-yahoo will use hardcoded fallback rates"
          fi

      # Workstream A1: SEC EDGAR Form-4 daily insider pull (index-driven).
      # Reads SEC's daily form index, keeps Form-4 rows whose issuer CIK is on
      # the watchlist, fetches each hit's submission .txt, parses out insider
      # transactions, and merges P-buys/sales into external-data/sec-form4-cache.json.
      # Runs BEFORE the Yahoo pull so the cache is committed in the same run.
      # continue-on-error: SEC outages / rate-limits must not block the Yahoo
      # pipeline; the cache is resumable and picks up missed dates next run.
      - name: Pull Insider Form-4 (daily)
        env:
          DAYS: '5'
        run: node scripts/pull-insider-form4-daily.js
        timeout-minutes: 30
        continue-on-error: true

      # Tag 220c (audit F-219c): Yahoo Schema-Drift Canary. Runs IMMEDIATELY
      # before the Yahoo pull so a silent Yahoo field move (like the Tag 219c F1
      # financialCurrency disappearance that mis-FX'd every ADR for weeks) is
      # surfaced within 24h instead of corrupting data silently. The canary
      # checks NVDA + TSM (TSM exercises the TWD!=USD financialCurrency divergence).
      # MUST NOT block the pull: continue-on-error:true AND the step exits 0
      # after alerting — drift fires a ::error:: annotation + a clearly-labeled
      # Discord ping, but daily-pull (which has its own multi-anchor fallback)
      # still runs. Canary exit-code contract: 1=drift, 2=Yahoo-unreachable
      # (non-fatal, treated like 0), 0=clean.
      - name: Schema-Drift Canary
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set +e
          node tests/yahoo-schema-canary.js
          canary_exit=$?
          echo "Schema-Drift Canary exit code: $canary_exit"
          if [ "$canary_exit" -eq 1 ]; then
            echo "::error::SCHEMA-CANARY DRIFT — Yahoo field(s) moved; pull-yahoo extraction may be silently corrupting data"
            if [ -z "$DISCORD_WEBHOOK" ]; then
              echo "DISCORD_WEBHOOK not set, skipping Discord notification."
            else
              curl -H "Content-Type: application/json" -X POST \
                -d "{\"content\": \"🚨 SCHEMA-CANARY DRIFT — Yahoo field(s) moved; pull-yahoo extraction may be silently corrupting data. Detected at $(date -u). See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
                "$DISCORD_WEBHOOK"
            fi
          fi
          # Never block the pull: the ::error:: annotation + Discord ping have
          # already fired; exit 0 so the pull proceeds (continue-on-error also
          # guards this, but exiting 0 keeps the step itself green).
          exit 0

      - name: Run Yahoo Pull
        env:
          FUNDAMENTALS_MAX_AGE_DAYS: '7'
          # 2026-06: market-cap floor lowered $1B → $800M so the universe covers
          # the broader US small/mid-cap set (per user "screen all US companies").
          # Must match the local fill-pull floor, else this daily pull would
          # re-purge $800M–$1B names on their next staleness refresh.
          MIN_MCAP_USD: '800000000'
        run: node --max-old-space-size=6144 pull-yahoo.js --watchlist watchlist.json --output snapshots --rate-limit 2000
        continue-on-error: true
        timeout-minutes: 165

      # Tag 261: persist the freshly-pulled snapshots to the cross-run cache REGARDLESS of the
      # later coverage-gate outcome (`if: always()`). The paired restore step above is now
      # restore-only, so this is the ONLY save path. Per-run key -> always a new entry; the
      # next run's restore-keys grabs it and price-onlys those tickers (cheap), warming the
      # universe until coverage clears the floor. Without this the pull-diet can never start
      # (Bootstrapping-Deadlock: gate blocks -> job fails -> @v4 post-save skipped -> empty).
      - name: Save snapshot cache (always — persists even when the coverage gate blocks)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: snapshots
          key: snapshots-${{ github.run_id }}

      # Tag 147: Quality-gate — fail hard only if coverage is too low to produce useful reports
      # Tag 161: relative threshold — max(1800, 40% of n_total)
      # Tag 162: file-count fallback — when Yahoo Pull times out the manifest is missing/zero
      # (manifest deleted at pull start, only written at pull end). Fall back to counting
      # actual .json snapshot files so partial-run progress is not thrown away.
      # F-CI-002: check manifest freshness — stale committed manifest from a prior run
      # would declare pass even when the current pull crashed early.
      - name: Check Manifest Freshness
        run: |
          if [ -f snapshots/_manifest.json ]; then
            # Tag 219a (audit F-218c-06): on stat failure fall back to NOW (fail-open),
            # not 0 (epoch start / fail-closed). The outer [ -f ] already confirmed the
            # file exists; if `stat` itself errors transiently, the previous `|| echo 0`
            # would silently `rm -f` a perfectly-fresh manifest and force the file-count
            # fallback. Keeping the manifest is the safer default — a genuinely stale
            # manifest gets caught on the next run.
            now=$(date +%s)
            manifest_mtime=$(stat -c %Y snapshots/_manifest.json 2>/dev/null || echo "$now")
            four_hours_ago=$(date -d '4 hours ago' +%s 2>/dev/null || echo "$((now - 14400))")
            if [ "$manifest_mtime" -lt "$four_hours_ago" ]; then
              echo "WARNING: snapshots/_manifest.json is older than 4 hours (mtime=$manifest_mtime, threshold=$four_hours_ago). Manifest may be stale from a prior run — file-count fallback will be used."
              rm -f snapshots/_manifest.json
            else
              echo "Manifest is fresh (mtime=$manifest_mtime)."
            fi
          else
            echo "No manifest found — file-count fallback will be used."
          fi

      # F-CI-016 (Tag 192): Snapshot-Freshness-Gate nach Pull, vor Downstream-Reports.
      # Problem: prior-failed-pull snapshots haben asOf von gestern; downstream
      # (snapshot-picks, detect-changes, walk-forward) verarbeitet sie als "heute"
      # → vintage duplication + 0% forward-return. Hier zählen wir wieviele
      # snapshots wirklich neuere asOf-Werte haben (< 36h alt). Wenn <50%
      # frisch sind, abort — der Pull war effektiv ein No-Op.
      - name: Verify Snapshot Freshness
        run: |
          node -e "
            const fs = require('fs');
            const dir = './snapshots';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json') && !f.startsWith('_'));
            const now = Date.now();
            const FRESH_MS = 36 * 3600 * 1000;
            let fresh = 0, stale = 0, unparseable = 0;
            for (const f of files) {
              try {
                const buf = require('fs').readFileSync(dir + '/' + f, 'utf8').slice(0, 800);
                // Tag 218: match BOTH asOf and fetchedAt. Pre-Tag-215j snapshots
                // only had fetchedAt; matching only asOf counted them all as
                // unparseable — Tag 215j fixed the pull side but old snapshots
                // in the repo still need backwards-compat.
                const m = buf.match(/\"(?:asOf|fetchedAt)\"\s*:\s*\"([^\"]+)\"/);
                if (!m) { unparseable++; continue; }
                const ts = new Date(m[1]).getTime();
                if (now - ts < FRESH_MS) fresh++; else stale++;
              } catch (e) { unparseable++; }
            }
            const pct = files.length > 0 ? (fresh / files.length * 100).toFixed(1) : '0';
            console.log('Snapshot freshness: ' + fresh + ' fresh / ' + stale + ' stale / ' + unparseable + ' unparseable of ' + files.length + ' (' + pct + '% fresh)');
            if (files.length > 0 && fresh / files.length < 0.5) {
              console.error('::error::F-CI-016 — fewer than 50% of snapshots are fresh (<36h asOf). Pull likely failed; refusing to publish stale data.');
              process.exit(1);
            }
          "
        # Tag 218 (audit F-218c-01 HIGH): flip from continue-on-error:true to
        # fail-on-error. Tag 192's 'WARN initially; flip later' has been dormant
        # for months — stale pulls flowed downstream into snapshot-picks,
        # detect-changes, walk-forward. Now combined with Tag 218 regex fix
        # (match asOf OR fetchedAt) the gate can finally do its job.
        continue-on-error: false

      # Frage 11 (two-stage coverage gate). Replaces the single-threshold gate.
      # Signal path is red-X (::error::) + a machine-readable marker in the
      # DEPLOYED export (outputs/coverage-status.json) — NO mail/Discord (Karl
      # reads neither). The marker binds to findash-export v1 (task 1.1): the
      # dashboard reads status/banner from it.
      #
      # IMPORTANT: outputs/ is .gitignored (repo convention: "committed via
      # gh-pages only"). The marker is therefore DEPLOY-ONLY — the Deploy step
      # copies the working-tree outputs/. into _site/outputs/, so the marker
      # reaches gh-pages. It is NOT committed to main. The export contract
      # (task 1.1) must read the marker from the gh-pages URL, not main.
      #
      # THREE outcomes, ONE marker file always written:
      #   KATASTROPHAL -> exit 1, BLOCK deploy (Deploy step is `if: success()`).
      #     schema-broken (manifest unreadable / n_ok==0) OR
      #     n_ok < HARD_FLOOR = max(2500, 13% of n_total).  [UNCHANGED old gate]
      #   DEGRADIERT   -> exit 0, DEPLOY partial WITH flag + ::error::/::warning::.
      #     n_ok >= HARD_FLOOR but not a clean full pull: partial==true OR
      #     n_ok < SOFT_TARGET = max(4600, 18% of n_total) OR failure-mass >35%.
      #   OK           -> exit 0, deploy, banner hidden.
      #
      # A 12% timeout run is < HARD_FLOOR -> katastrophal -> blocks, as required
      # (the floor is NOT lowered; it is the old max(2500,0.13*n_total) promoted).
      - name: Verify Pull Coverage (two-stage)
        run: node scripts/coverage-gate.js

      # --- OLD single-threshold gate (retired by Frage 11) — kept disabled for
      #     reference during the export-v1 rollout; delete once the marker is proven.
      - name: Verify Pull Coverage (legacy, disabled)
        if: ${{ false }}
        run: |
          # Tag 220c (audit F-219b-02 MEDIUM): manifest's `partial` flag reports
          # a mid-flight SIGKILL of Yahoo Pull. pull-yahoo writes partial:true on
          # every incremental flush (~100 tickers) and partial:false only on the
          # clean final write.
          #
          # Tag 232c-2: 220c originally exit-1'd on partial=true regardless of
          # n_ok. With MAX_UNIVERSE at 25k (Tag 227a-1) the 165-min Yahoo Pull
          # budget can't reliably finish — partial=true became the norm, blocking
          # the pipeline permanently. Run 26022734084 today: partial:true,
          # n_ok=4613 > min_ok=3608 → would have passed the coverage gate, but
          # 220c killed it first. Relaxed: emit ::warning on partial=true so the
          # operator sees the signal in the run log, then let the n_ok threshold
          # below be the actual gate. n_ok is accurate (counted on each
          # successful pull) — just smaller than n_total when the run was killed.
          # Downstream operates per-snapshot (each carries meta.asOf), so
          # incomplete updates degrade gracefully instead of polluting aggregates.
          partial=$(node -e "const fs=require('fs');try{const m=JSON.parse(fs.readFileSync('./snapshots/_manifest.json','utf8'));console.log(m.partial===true?'true':'false')}catch(e){console.log('false')}")
          if [ "$partial" = "true" ]; then
            echo "::warning::Manifest reports partial=true — pull was killed mid-flight. Letting the coverage gate (n_ok ≥ max(2500, 13%)) decide."
          fi
          ok=$(node -e "const fs=require('fs');try{const m=JSON.parse(fs.readFileSync('./snapshots/_manifest.json','utf8'));console.log(m.n_ok||0)}catch(e){console.log(0)}")
          total=$(node -e "const fs=require('fs');try{const m=JSON.parse(fs.readFileSync('./snapshots/_manifest.json','utf8'));console.log(m.n_total||0)}catch(e){console.log(0)}")
          source="manifest"
          # F-CI-012: use watchlist length as the denominator in fallback (not file_count)
          # to avoid 100% coverage when total=file_count and ok=file_count (1800/1800 = 100%)
          # Tag 207b: schema-aware watchlist size (same fix pattern as Tag 207a).
          # Watchlist is { _meta, stocks:[...], lastUniverseRefresh, ... } since wrap;
          # counting Object.keys returned 4 instead of 15734 (only mattered in the
          # fallback branch but still latent bug).
          watchlist_total=$(node -e "const fs=require('fs');try{const w=JSON.parse(fs.readFileSync('./watchlist.json','utf8'));let n;if(Array.isArray(w))n=w.length;else if(w&&Array.isArray(w.stocks))n=w.stocks.length;else n=Object.keys(w).length;console.log(n)}catch(e){console.log(0)}")
          if [ "$total" -eq 0 ] || [ "$ok" -eq 0 ]; then
            file_count=$(node -e "const fs=require('fs');try{const files=fs.readdirSync('./snapshots').filter(f=>f.endsWith('.json')&&f!=='_manifest.json');console.log(files.length)}catch(e){console.log(0)}")
            echo "Manifest reports $ok/$total — falling back to file count: $file_count .json files in ./snapshots/"
            ok=$file_count
            # F-CI-012: use watchlist total as denominator so 1800/13000 correctly fails the 40% gate
            if [ "$watchlist_total" -gt 0 ]; then
              total=$watchlist_total
              source="file-count/watchlist-denom"
            else
              total=$file_count
              source="file-count"
            fi
          fi
          # Tag 207b: relaxed coverage gate after run #104 failed at this step with a
          # 7-hour Yahoo Pull (compared to historical 75-165min). Yahoo's reliability
          # fluctuates; the prior 40%/1800-floor was too strict — one bad-Yahoo day
          # killed the entire pipeline. New: 25% relative / 1000 absolute floor.
          # Still rejects "Yahoo totally broken" (~0 pulls) but tolerates 20-40%
          # throttle days that historically passed.
          #
          # Tag 215e: universe grew from ~13k (Tag 207b era) to ~19k (Tag 215 era)
          # because refresh-universe expanded discovery (Tag 165 NASDAQ Screener API
          # + Tag 165 OTC Markets). Same percentage-of-universe gate is now
          # effectively tighter — Run #105/#106/#107 all delivered 3500-3700
          # snapshots which is healthy by absolute count but only 18-19% of the
          # bigger universe. Calibrating to ABSOLUTE 2500 + RELATIVE 18% so a
          # 3500-snapshot pull (the historical-normal absolute count) passes
          # regardless of universe expansion. Yahoo-totally-broken (<1000 ok)
          # still hard-fails.
          #
          # Tag 233: universe grew further from ~19k (Tag 215e era) to ~24k (Tag 232
          # era, May 2026). At PULL_CONCURRENCY=8 and a 165-min budget, the pull
          # completes ~3300 snapshots/run (sorted by staleness, so stale tickers rotate
          # through across days). 3300/24000 = 13.8% — below the 18% gate that was
          # calibrated when universe=19k. The absolute snapshot count is unchanged
          # (3300-3500/run is healthy); the gate mis-fires because the denominator grew.
          # Recalibrating to 13% so max(2500, 24000*0.13=3120) ≈ 3120 < 3300. This
          # still hard-fails a "Yahoo totally broken" run (~0 snapshots) or a severe
          # throttle day (<2500). Absolute floor stays at 2500.
          min_ok=$(node -e "console.log(Math.max(2500,Math.floor(${total}*0.13)))")
          echo "Snapshots ok: $ok / $total (threshold: $min_ok = max(2500, total*0.13), source: $source)"
          if [ "$ok" -lt "$min_ok" ]; then
            echo "::error::Pull coverage $ok/$total < threshold $min_ok (13% of universe, floor 2500, source: $source)"
            exit 1
          fi

      # Tag-63: Earnings-Calendar Pull
      # F-CI-005: Pipeline Health Check moved to AFTER commit so snapshots are always
      # committed even if health check fails (prevents vintage continuity gaps).
      # Tag 232c-25 (audit F-CI-008 LOW): EARNINGS_CONCURRENCY 20→8 + per-step
      # timeout. The Tag 215f lesson (PULL_CONCURRENCY 20→8 because Yahoo
      # Cloudflare Edge rate-limited at 20) applies here too — same upstream
      # API. 20-way parallelism just trades wall-time savings for retry storms.
      - name: Pull Earnings-Calendar
        env:
          EARNINGS_CONCURRENCY: '8'
        run: node pull-earnings-dates.js
        timeout-minutes: 20
        continue-on-error: true

      # Tag-39: Historical-Price-Pull (für Performance-Backtest)
      # Tag 232c-25 (audit F-CI-008 LOW): PRICE_CONCURRENCY 20→8 + per-step
      # timeout. Same Yahoo Cloudflare throttle as Yahoo Pull.
      - name: Pull Historical Prices
        env:
          PRICE_CONCURRENCY: '8'
        run: node pull-historical-prices.js --out prices --rate-limit 1500
        timeout-minutes: 25
        continue-on-error: true

      # Tag 139: Macro-Regime-Tagging — SPY 200d-MA → BULL/BEAR/SIDEWAYS
      - name: Compute Macro Regime
        run: node scripts/macro-regime.js
        continue-on-error: true

      # Tag 133g: Pull-Stats Monitoring — Discord-Alert wenn ein Pull-Output >25% vs 4-Week-Median shrinkt.
      - name: Pull-Stats Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ALLOW_PULL_DRIFT: ${{ vars.ALLOW_PULL_DRIFT || '0' }}
        run: |
          # F-CI-007: consistent DISCORD_WEBHOOK existence check before invoking script
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK not configured — Discord alerts disabled."; fi
          node scripts/check-pull-stats.js
        continue-on-error: true

      # Tag 134 — Phase 5.1: archive prices/ daily snapshots older than --keep-days
      # into external-data/*.ndjson (git-ignored). Reduces committed repo bloat.
      # Rebuildable from snapshots on the runner.
      #
      # Loop A removed the methods-history/ and picks-history/ WRITERS, so those
      # dirs are frozen (no new files — the newest are the 2026-06-12 vintages).
      # Previously this step passed --methods-keep-days 90 --picks-keep-days 90,
      # which would archive each frozen file into git-ignored, runner-ephemeral
      # NDJSON and then unlink + push the deletion of the committed original once
      # it aged past 90 days (~2026-09-10) — silently losing OLD scoring vintages
      # from main with no durable backup (only git history). Nothing regenerates
      # them. Fix: stop archiving the frozen dirs by setting their keep-windows
      # effectively-infinite (100000 days), leaving the committed files untouched.
      # (Omitting the flags would fall back to --keep-days 14 and delete them even
      # sooner.) The live prices/ archiving is preserved via --keep-days 14.
      # A Loop-B writer can restore real keep-windows when it reintroduces them.
      - name: Archive Old Snapshots
        run: node scripts/archive-old-snapshots.js --keep-days 14 --methods-keep-days 100000 --picks-keep-days 100000
        continue-on-error: true

      # Task 0.8 — three pure-node coverage canaries (no new deps). Each writes/
      # refreshes a rolling data-health/ baseline BEFORE its ::error:: drift check,
      # so an ongoing alarm still updates the window. continue-on-error: a watcher
      # crash or false alarm must NOT block the data commit — the red-X on the step
      # is the alert (Karl reads neither email nor Discord). Placed after Verify
      # Pull Coverage, before Commit Snapshots, so the baseline writes land in this
      # run's 'git add -A'.
      - name: Watch Exchange Coverage
        run: node scripts/watch-exchange-coverage.js
        continue-on-error: true

      - name: Watch Unrouted Quote Share
        run: node scripts/watch-unrouted-quote.js
        continue-on-error: true

      - name: Watch FX Sanity
        run: node scripts/watch-fx-sanity.js
        continue-on-error: true
      - name: Commit Snapshots
        run: |
          git config user.name "yahoo-pull-bot"
          git config user.email "yahoo-pull-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: yahoo-pull $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # F-CI-001 v2 (Tag 179): the previous fallback `git rebase --abort; git reset
            # --hard origin/main` was CRITICAL data-loss — it discarded the just-made
            # commit, after which `git push` succeeded as a no-op and the workflow
            # reported green while a full day of snapshots vanished. New strategy:
            # capture the just-made commit SHA, attempt rebase, and on rebase failure
            # abort cleanly without resetting. If push still fails after 3 retries the
            # workflow exits non-zero so the failure is visible (Discord alert via
            # the notify step).
            COMMIT_SHA=$(git rev-parse HEAD)
            COMMIT_TREE=$(git rev-parse HEAD^{tree})
            echo "Local commit to publish: $COMMIT_SHA (tree $COMMIT_TREE)"
            for i in 1 2 3; do
              git fetch origin main
              # Tag 232c-7 (audit F-CI-002 HIGH): dropped --strategy-option theirs.
              # In rebase semantics, "theirs" = the upstream branch (origin/main),
              # so on a content conflict the OUR change (the just-made commit's
              # bytes) would be silently dropped. The post-rebase SHA-check only
              # verifies the commit OBJECT survived; if the tree got rewritten,
              # the commit looks present but its data is gone. Now: plain rebase,
              # which exits non-zero on any conflict, triggering the abort + cherry-
              # pick path below. ALSO: verify the tree hash matches what we just
              # committed — catches "commit present, content silently mutated"
              # scenarios that the prior SHA-only check missed.
              if ! git rebase --autostash origin/main; then
                echo "::warning::Rebase failed on attempt $i — aborting cleanly (preserves local commit)"
                git rebase --abort || true
                # Verify our commit is still here AND its tree wasn't mutated.
                NEW_TREE=$(git log -1 --format=%T "$COMMIT_SHA" 2>/dev/null || echo "MISSING")
                # F-CI-002/F-CI-003: use merge-base --is-ancestor instead of O(history) rev-list | grep
                if ! git merge-base --is-ancestor "$COMMIT_SHA" HEAD || [ "$NEW_TREE" != "$COMMIT_TREE" ]; then
                  echo "::warning::Local commit lost or mutated during rebase — restoring from $COMMIT_SHA (tree $COMMIT_TREE)"
                  git reset --hard origin/main
                  git cherry-pick "$COMMIT_SHA" || { echo "::error::cherry-pick failed"; exit 1; }
                fi
              else
                # F-CI-002: update SHA after successful rebase so subsequent iterations use the rewritten commit
                COMMIT_SHA=$(git rev-parse HEAD)
              fi
              if git push; then
                echo "✓ Pushed on attempt $i (commit $(git rev-parse HEAD))"
                exit 0
              fi
              echo "Push attempt $i failed, retrying..."
              sleep $((5 * i))
            done
            echo "::error::Push failed after 3 attempts — local commit $COMMIT_SHA NOT on remote"
            exit 1
          fi

      # Task 0.3 (Loop B): upload the final snapshots/ so the separate `scoring`
      # job can score them on a fresh runner (snapshots are gitignored -> not on
      # any branch it could checkout). Runs after Commit Snapshots so it captures
      # the complete post-pull set. retention short — same-run handoff, not archive.
      - name: Upload Snapshots Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            snapshots/*.json
          retention-days: 1
          if-no-files-found: error

      # Tag 168: Pipeline Health Check — aggregates per-script failure rates and
      # alerts via Discord if any script exceeded the 5% threshold.
      # F-CI-005: placed AFTER commit so snapshots always land in git even if health
      # check fails. Health check failure blocks deploy but not the data commit.
      # F-CI-008: --strategy-option theirs was dropped in Tag 232c-7; concurrent
      # pushes ARE possible via the manual dispatch escape hatch (workflow_dispatch
      # gets its own concurrency group, so a manual run can race a scheduled cron run).
      - name: Pipeline Health Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not configured — health check will run without Discord alerts."
          fi
          node scripts/pipeline-health-check.js

      # Tag 146: Deploy HTML reports to GitHub Pages (gh-pages branch).
      # Separates generated web artifacts from the data/code on main.
      # Deploys: index.html, modes-report.html, diff-report.html, outputs/*.html|csv|md
      # Enable in repo Settings → Pages → Source: Deploy from branch → gh-pages / root.
      # Tag 153: only deploy when data commit succeeded — otherwise gh-pages would show
      # picks from today's run that never landed in main (mismatched report vs data).
      - name: Deploy to GitHub Pages
        if: success()
        run: |
          # Build a clean deploy directory
          # Loop A: report generators removed; deploy index.html + outputs/ only until Loop B rebuilds the dashboard
          mkdir -p _site/outputs
          cp index.html _site/ 2>/dev/null || true
          cp -r outputs/. _site/outputs/ 2>/dev/null || true

          # Push to gh-pages branch (orphan-safe force push)
          cd _site
          git init -b gh-pages
          git config user.name "yahoo-pull-bot"
          git config user.email "yahoo-pull-bot@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          git commit -m "deploy: screener reports $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # F-CI-006: retry loop for transient push failures on gh-pages
          for i in 1 2 3; do
            if git push --force origin gh-pages; then
              echo "✓ GitHub Pages deployed on attempt $i"
              exit 0
            fi
            echo "gh-pages push attempt $i failed, retrying..."
            sleep $((5 * i))
          done
          echo "gh-pages push failed after 3 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set, skipping notification."
            exit 0
          fi
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"⚠ Yahoo-Pull failed at $(date -u). See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"

  # Task 0.3 (Loop B): separate scoring job. needs: pull so it runs only after a
  # successful pull. Fresh runner: checks out the repo (for src/scoring/** +
  # tracked external-data/*secannual.json), downloads the snapshots artifact into
  # snapshots/, runs the engine, then publishes outputs/hypergrowth/*.json to
  # gh-pages reusing the pull job's Deploy auth (x-access-token GITHUB_TOKEN
  # force-push). outputs/ is gitignored -> gh-pages only.
  # Timeout 15: run-screener is 0.56s over 4681 real snapshots (measured), pure
  # in-memory ranking, no network; wall time is checkout+setup-node+npm ci+download.
  scoring:
    needs: pull
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download Snapshots Artifact
        uses: actions/download-artifact@v4
        with:
          name: snapshots
          path: snapshots

      - name: Run Hypergrowth Screener
        run: |
          node src/scoring/run-screener.js
          # Karl reads only GitHub red-X — make a silent empty export a hard fail.
          count=$(ls outputs/hypergrowth/*.json 2>/dev/null | wc -l)
          echo "Scoring wrote $count JSON files to outputs/hypergrowth/"
          if [ "$count" -lt 3 ]; then
            echo "::error::Scoring produced $count outputs/hypergrowth/*.json (expected >=3) — engine failed or universe empty."
            exit 1
          fi

      # Task 1.1: build the versioned findash-export/v1 contract from the engine output
      # (latest-only, atomic via lib/atomic-write.js; never touches picks-history/ or
      # earnings-calendar.json), then hard-validate it before the deploy below.
      - name: Build findash-export v1
        run: |
          node scripts/write-findash-export.js
          count=$(ls outputs/findash-export/v1/*.json 2>/dev/null | wc -l)
          echo "findash-export wrote $count JSON files to outputs/findash-export/v1/"
          if [ "$count" -lt 15 ]; then
            echo "::error::findash-export produced $count files (expected 15) — writer failed."
            exit 1
          fi

      # Task 1.1: contract gate — presence + type + enum of EVERY mandatory field across
      # all 15 files. Non-empty violation list -> exit 1 -> blocks the if:success() deploy
      # (red-X, Karl's only alarm channel). Verified: 20 tamper variants all blocked,
      # clean export passes. Same fail-loud pattern as coverage-gate.js.
      - name: Verify findash-export v1 schema (contract gate)
        run: node scripts/write-findash-export.js --check

      # Publish outputs/hypergrowth/*.json to gh-pages, reusing the Deploy step's
      # x-access-token GITHUB_TOKEN force-push. Clone existing gh-pages first so
      # pull's index.html + other outputs survive; only refresh hypergrowth/.
      - name: Deploy Scoring Output to GitHub Pages
        if: success()
        run: |
          rm -rf _ghp
          git clone --depth 1 --branch gh-pages \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git _ghp \
            || { mkdir -p _ghp; cd _ghp; git init -b gh-pages; cd ..; }
          mkdir -p _ghp/outputs/hypergrowth
          cp outputs/hypergrowth/*.json _ghp/outputs/hypergrowth/
          # Task 1.1: publish the findash-export/v1 contract alongside the raw boards.
          mkdir -p _ghp/outputs/findash-export/v1
          cp -r outputs/findash-export/v1/. _ghp/outputs/findash-export/v1/
          cd _ghp
          git config user.name "yahoo-pull-bot"
          git config user.email "yahoo-pull-bot@users.noreply.github.com"
          git remote get-url origin >/dev/null 2>&1 || git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          if git diff --staged --quiet; then echo "No scoring output changes to deploy."; exit 0; fi
          git commit -m "deploy: hypergrowth scoring $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            if git push --force origin gh-pages; then
              echo "✓ Scoring output deployed on attempt $i"
              exit 0
            fi
            echo "gh-pages push attempt $i failed, retrying..."
            sleep $((5 * i))
          done
          echo "::error::gh-pages scoring deploy failed after 3 attempts"
          exit 1
